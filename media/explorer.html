<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src {{cspSource}} data:; style-src {{cspSource}} 'unsafe-inline'; script-src 'nonce-{{nonce}}' {{cspSource}};">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knowledge Explorer</title>
<style>
  :root {
    --gap: 12px; --radius: 6px;
    --border: var(--vscode-editorWidget-border, var(--vscode-panel-border, #4446));
    --muted: var(--vscode-descriptionForeground);
    --surface: var(--vscode-editorWidget-background, var(--vscode-sideBar-background));
    --hover: var(--vscode-list-hoverBackground);
    --active: var(--vscode-list-activeSelectionBackground);
    --active-fg: var(--vscode-list-activeSelectionForeground);
    --link: var(--vscode-textLink-foreground);
    --t-verified: var(--vscode-testing-iconPassed, #2ea043);
    --t-confirmed: var(--vscode-charts-blue, #3794ff);
    --t-documented: var(--vscode-descriptionForeground, #888);
    --t-assumed: var(--vscode-charts-orange, #d18616);
    --t-inferred: var(--vscode-editorWarning-foreground, #cca700);
    --danger: var(--vscode-editorError-foreground, #f14c4c);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font-family: var(--vscode-font-family); font-size: var(--vscode-font-size); color: var(--vscode-foreground); background: var(--vscode-editor-background); display: flex; flex-direction: column; overflow: hidden; }
  button { font: inherit; color: inherit; }
  .btn { background: var(--vscode-button-secondaryBackground); color: var(--vscode-button-secondaryForeground); border: 1px solid transparent; border-radius: 4px; padding: 3px 10px; cursor: pointer; }
  .btn:hover { background: var(--vscode-button-secondaryHoverBackground); }
  .btn.primary { background: var(--vscode-button-background); color: var(--vscode-button-foreground); }
  .btn.primary:hover { background: var(--vscode-button-hoverBackground); }
  .btn:focus-visible, .link:focus-visible, [tabindex]:focus-visible, input:focus-visible, select:focus-visible { outline: 1px solid var(--vscode-focusBorder); outline-offset: 1px; }
  .link { background: none; border: none; padding: 0; color: var(--link); cursor: pointer; text-align: left; }
  .link:hover { text-decoration: underline; }
  input[type=search], input[type=text], select { background: var(--vscode-input-background); color: var(--vscode-input-foreground); border: 1px solid var(--vscode-input-border, var(--border)); border-radius: 4px; padding: 4px 8px; font: inherit; }
  code, .mono { font-family: var(--vscode-editor-font-family); font-size: 0.95em; }
  .muted { color: var(--muted); }
  .small { font-size: 11px; }

  /* Top bar */
  header { display: flex; align-items: center; gap: 12px; padding: 8px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  header h1 { font-size: 13px; margin: 0; font-weight: 600; white-space: nowrap; }
  .searchbox { flex: 1; display: flex; align-items: center; gap: 6px; max-width: 640px; position: relative; }
  .searchbox input { width: 100%; padding-left: 26px; }
  .searchbox .icon { position: absolute; left: 8px; opacity: 0.6; pointer-events: none; }
  .searchbox kbd { position: absolute; right: 8px; font-size: 10px; opacity: 0.6; border: 1px solid var(--border); border-radius: 3px; padding: 0 4px; }
  nav.views { display: flex; gap: 2px; }
  nav.views button { background: none; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; color: var(--muted); }
  nav.views button[aria-selected=true] { color: var(--vscode-foreground); background: var(--hover); font-weight: 600; }
  .history { display: flex; gap: 2px; }
  .history button { background: none; border: none; cursor: pointer; padding: 2px 6px; border-radius: 4px; color: var(--muted); }
  .history button:disabled { opacity: 0.35; cursor: default; }
  .history button:not(:disabled):hover { background: var(--hover); color: var(--vscode-foreground); }

  main { flex: 1; min-height: 0; display: flex; }
  .view { flex: 1; min-height: 0; display: none; }
  .view.on { display: flex; }

  /* Explore: facets | results | asset */
  aside.facets { width: 200px; flex-shrink: 0; border-right: 1px solid var(--border); overflow-y: auto; padding: 10px 12px; }
  .facet { margin-bottom: 14px; }
  .facet h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
  .facet label { display: flex; align-items: center; gap: 6px; padding: 1px 0; cursor: pointer; font-size: 12px; }
  .facet label .n { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  section.results { width: 340px; flex-shrink: 0; border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
  .results-head { padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
  ul.list { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
  ul.list li { padding: 6px 12px; cursor: pointer; border-bottom: 1px solid color-mix(in srgb, var(--border) 40%, transparent); }
  ul.list li:hover { background: var(--hover); }
  ul.list li[aria-selected=true] { background: var(--active); color: var(--active-fg); }
  ul.list li .t { display: flex; align-items: center; gap: 6px; min-width: 0; }
  ul.list li .t .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  ul.list li .s { font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 1px; }
  ul.list li[aria-selected=true] .s { color: inherit; opacity: 0.85; }
  .more { padding: 8px 12px; text-align: center; }
  article.asset { flex: 1; min-width: 0; overflow-y: auto; padding: 16px 22px 40px; }

  /* Badges */
  .badge { display: inline-flex; align-items: center; gap: 3px; border-radius: 10px; padding: 0 7px; font-size: 10.5px; line-height: 17px; border: 1px solid var(--border); white-space: nowrap; color: var(--muted); }
  .kind { text-transform: uppercase; letter-spacing: 0.04em; font-size: 9.5px; font-weight: 600; }
  .trust::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; display: inline-block; }
  .trust-verified { color: var(--t-verified); border-color: var(--t-verified); }
  .trust-confirmed { color: var(--t-confirmed); border-color: var(--t-confirmed); }
  .trust-documented { color: var(--t-documented); }
  .trust-assumed { color: var(--t-assumed); border-color: var(--t-assumed); }
  .trust-inferred { color: var(--t-inferred); border-color: var(--t-inferred); border-style: dashed; }
  .pii { color: var(--danger); border-color: var(--danger); }
  .cert::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; display: inline-block; }
  .cert-verified { color: var(--t-verified); border-color: var(--t-verified); }
  .cert-documented { color: var(--t-documented); }
  .cert-unverified { color: var(--t-assumed); border-color: var(--t-assumed); border-style: dashed; }
  .cert-draft { color: var(--muted); border-style: dashed; }
  .attention { border: 1px solid var(--border); border-left: 3px solid var(--accent, var(--border)); border-radius: 4px; padding: 6px 10px; margin: 8px 0; }
  .attention h4 { margin: 2px 0 4px; }
  .cert-deprecated { color: var(--danger); border-color: var(--danger); text-decoration: line-through; }
  .facet.pending h3 { opacity: 0.6; }
  .layers { display: inline-flex; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
  .layers button { background: none; border: none; padding: 3px 10px; cursor: pointer; color: var(--muted); font-size: 12px; }
  .layers button + button { border-left: 1px solid var(--border); }
  .layers button[aria-checked=true] { background: var(--active); color: var(--active-fg); }
  .layer { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.04em; }
  .layer-physical { color: var(--vscode-charts-blue, #3794ff); border-color: var(--vscode-charts-blue, #3794ff); }
  .layer-context { color: var(--vscode-charts-purple, #b180d7); border-color: var(--vscode-charts-purple, #b180d7); }
  .layer-semantic { color: var(--vscode-charts-green, #89d185); border-color: var(--vscode-charts-green, #89d185); }
  .model-card { border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 14px; background: var(--surface); }
  .model-card h3 { margin: 0 0 6px; font-size: 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .aside-tabs { display: flex; gap: 2px; margin-bottom: 10px; }
  .aside-tabs button { flex: 1; background: none; border: 1px solid var(--border); padding: 3px 0; cursor: pointer; color: var(--muted); font-size: 11px; }
  .aside-tabs button[aria-selected=true] { background: var(--active); color: var(--active-fg); }
  ul.tree { list-style: none; margin: 0; padding: 0 0 0 10px; font-size: 12px; }
  ul.tree.root { padding-left: 0; }
  ul.tree li > div { display: flex; align-items: center; gap: 4px; padding: 2px 0; cursor: pointer; white-space: nowrap; }
  ul.tree li > div:hover { background: var(--hover); }
  ul.tree .tw { width: 12px; text-align: center; color: var(--muted); flex-shrink: 0; }
  ul.tree .lbl { overflow: hidden; text-overflow: ellipsis; }
  ul.tree .n { margin-left: auto; color: var(--muted); font-size: 10px; padding-left: 4px; }
  .facet.pending .muted { font-size: 11px; }
  .draft { border-style: dashed; }

  /* Asset page */
  .crumbs { font-size: 11px; color: var(--muted); margin-bottom: 6px; display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }
  .asset-head h2 { margin: 2px 0 4px; font-size: 18px; font-weight: 600; word-break: break-word; }
  .asset-head .fqn { font-family: var(--vscode-editor-font-family); font-size: 12px; color: var(--muted); word-break: break-all; }
  .asset-head .badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .asset-head .desc { margin: 6px 0 10px; max-width: 80ch; line-height: 1.5; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 14px; }
  [role=tablist].tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 14px; overflow-x: auto; }
  [role=tablist].tabs button { background: none; border: none; border-bottom: 2px solid transparent; padding: 6px 12px; cursor: pointer; color: var(--muted); white-space: nowrap; }
  [role=tablist].tabs button[aria-selected=true] { color: var(--vscode-foreground); border-bottom-color: var(--vscode-focusBorder); }
  [role=tablist].tabs button .count { margin-left: 4px; font-size: 10px; opacity: 0.8; }
  h4 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 18px 0 6px; font-weight: 600; }
  table.grid { border-collapse: collapse; width: 100%; font-size: 12px; }
  table.grid th { text-align: left; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--border); padding: 5px 8px; position: sticky; top: 0; background: var(--vscode-editor-background); }
  table.grid td { border-bottom: 1px solid color-mix(in srgb, var(--border) 40%, transparent); padding: 5px 8px; vertical-align: top; }
  table.grid tr.click { cursor: pointer; }
  table.grid tr.click:hover td { background: var(--hover); }
  dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 0; font-size: 12px; }
  dl.kv dt { color: var(--muted); }
  dl.kv dd { margin: 0; word-break: break-word; }
  .item { padding: 6px 0; border-bottom: 1px solid color-mix(in srgb, var(--border) 40%, transparent); }
  .item .ev { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .note { border-left: 3px solid var(--link); background: var(--vscode-textBlockQuote-background); padding: 6px 10px; font-size: 12px; margin: 10px 0; }
  .warn { border-left-color: var(--t-assumed); }
  .empty { color: var(--muted); padding: 24px 0; text-align: center; }
  .empty .big { font-size: 28px; opacity: 0.5; display: block; margin-bottom: 6px; }

  /* Overview */
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin: 10px 0 18px; }
  .tile { border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; background: var(--surface); }
  .tile .v { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .tile .l { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--border); margin: 4px 0 2px; }
  .bar span { display: block; height: 100%; }
  .legend { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11px; color: var(--muted); }

  /* Graph */
  .graph-wrap { position: relative; display: flex; flex-direction: column; height: calc(100vh - 260px); min-height: 360px; border: 1px solid var(--border); border-radius: var(--radius); }
  .graph-page { display: flex; flex-direction: column; padding: 10px 16px; gap: 8px; overflow: hidden; }
  .graph-page .graph-wrap { flex: 1; height: auto; }
  .graph-canvas { flex: 1; min-height: 0; }
  .gcard { position: absolute; top: 46px; right: 10px; width: 280px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.25); z-index: 5; font-size: 12px; }
  .gcard h3 { margin: 4px 0; font-size: 13px; word-break: break-word; }
  .gcard .fqn { font-family: var(--vscode-editor-font-family); color: var(--muted); font-size: 11px; word-break: break-all; }
  .gcard .row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .gcard .close { position: absolute; top: 4px; right: 6px; background: none; border: none; cursor: pointer; color: var(--muted); }
  .legend-line { display: inline-flex; align-items: center; gap: 4px; }
  .legend-line i { display: inline-block; width: 22px; border-top: 2px solid var(--muted); }
  .legend-line i.dash { border-top-style: dashed; }
  .legend-line i.dot { border-top-style: dotted; }
  .graph-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 6px 8px; border-bottom: 1px solid var(--border); font-size: 12px; }
  .graph-tools label { display: inline-flex; align-items: center; gap: 4px; }
  #cy, #lcy, #lincy { flex: 1; min-height: 0; }
  .lin-wrap { height: 420px; }
  .src { font-size: 10px; padding: 0 5px; border-radius: 8px; border: 1px solid var(--border); margin-right: 3px; white-space: nowrap; }
  .src-observed { border-color: var(--vscode-testing-iconPassed, #2ea043); }
  .src-designed { border-color: var(--vscode-charts-blue, #3794ff); }
  .src-generated { border-color: var(--vscode-charts-purple, #b180d7); }
  .src-logical { border-color: var(--vscode-charts-green, #89d185); }
  .impact-path { font-size: 11px; color: var(--muted); }
  .impact-cat { margin-top: 10px; }
  .graph-foot { padding: 4px 8px; border-top: 1px solid var(--border); font-size: 11px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }

  /* Facts and estate views */
  .page { flex: 1; overflow-y: auto; padding: 14px 22px 40px; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 10px; }
  .card { border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; background: var(--surface); }
  .card h3 { margin: 0 0 4px; font-size: 13px; }
  .toast { position: fixed; bottom: 16px; right: 16px; background: var(--vscode-notifications-background, var(--surface)); color: var(--vscode-notifications-foreground, inherit); border: 1px solid var(--border); border-radius: var(--radius); padding: 8px 12px; font-size: 12px; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
  .toast.on { opacity: 1; }
  @media (max-width: 1000px) { aside.facets { display: none; } section.results { width: 280px; } }
  @media (max-width: 700px) { section.results { display: none; } section.results.force { display: flex; width: 100%; } }
</style>
</head>
<body>
<header>
  <h1>Knowledge Explorer</h1>
  <div class="history" aria-label="History">
    <button id="home" title="Overview (Alt+Home)" aria-label="Overview">⌂</button>
    <button id="back" title="Back (Alt+Left)" aria-label="Back" disabled>←</button>
    <button id="fwd" title="Forward (Alt+Right)" aria-label="Forward" disabled>→</button>
  </div>
  <div class="searchbox" role="search">
    <span class="icon" aria-hidden="true">⌕</span>
    <input id="q" type="search" placeholder="Search tables, columns, terms, metrics, facts…" aria-label="Search what AutoDE knows" autocomplete="off" spellcheck="false">
    <kbd aria-hidden="true">/</kbd>
  </div>
  <div class="layers" role="radiogroup" aria-label="Layer">
    <button role="radio" data-layer="" aria-checked="true" title="Every layer">All</button>
    <button role="radio" data-layer="physical" aria-checked="false" title="What exists: tables, views, columns">Physical</button>
    <button role="radio" data-layer="context" aria-checked="false" title="What it means and what is known: glossary, rules, knowledge facts">Context</button>
    <button role="radio" data-layer="semantic" aria-checked="false" title="How it is measured: semantic models, metrics, relationships, verified queries">Semantic</button>
  </div>
  <nav class="views" role="tablist" aria-label="Views">
    <button role="tab" data-view="explore" aria-selected="true">Explore</button>
    <button role="tab" data-view="graph" aria-selected="false">Graph</button>
    <button role="tab" data-view="facts" aria-selected="false">Facts</button>
    <button role="tab" data-view="estate" aria-selected="false">Estate</button>
  </nav>
</header>
<main>
  <div class="view on" id="view-explore">
    <aside class="facets" aria-label="Filters and browse"><div class="aside-tabs" role="tablist"><button role="tab" data-aside="filters" aria-selected="true">Filters</button><button role="tab" data-aside="browse" aria-selected="false">Browse</button></div><div id="facets"></div><div id="browse" hidden><ul class="tree root" id="tree" role="tree" aria-label="Databases, schemas, tables"></ul></div></aside>
    <section class="results" aria-label="Results">
      <div class="results-head"><span id="resultCount">Everything AutoDE knows</span><button class="link small" id="clearFilters" hidden>Clear filters</button></div>
      <ul class="list" id="results" role="listbox" aria-label="Search results" tabindex="0"></ul>
    </section>
    <article class="asset" id="asset" aria-live="polite"></article>
  </div>
  <div class="view" id="view-graph"><div class="page graph-page">
    <div class="graph-tools" id="lTools" aria-label="Graph options"></div>
    <div class="graph-wrap"><div id="lcy" role="img" aria-label="The landscape: tables and the relationships between them"></div><div class="gcard" id="lCard" hidden></div><div class="graph-foot" id="lFoot"></div></div>
  </div></div>
  <div class="view" id="view-facts"><div class="page" id="factsPage"></div></div>
  <div class="view" id="view-estate"><div class="page" id="estatePage"></div></div>
</main>
<div class="toast" id="toast" role="status"></div>
<script src="{{cytoscapeUri}}"></script>
<script nonce="{{nonce}}">
(function () {
  const vscode = acquireVsCodeApi();
  const $ = (s) => document.querySelector(s);
  const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  // Asset types and facets as catalogs and Snowflake's semantic model name them (context-layer §6.11).
  const KIND = { database: 'Database', schema: 'Schema', domain: 'Domain', data_product: 'Data product', knowledge_article: 'Knowledge article', table: 'Table', view: 'View', column: 'Column', glossary_term: 'Glossary term', rule: 'Rule', verified_query: 'Verified query', semantic_model: 'Semantic model', logical_table: 'Logical table', dimension: 'Dimension', time_dimension: 'Time dimension', semantic_fact: 'Fact (semantic)', metric: 'Metric', filter: 'Filter', relationship: 'Relationship', custom_instruction: 'Custom instructions', knowledge_fact: 'Knowledge fact' };
  const LAYER = { physical: 'Physical', context: 'Context', semantic: 'Semantic' };
  const TRUST = ['verified', 'confirmed', 'documented', 'assumed', 'inferred'];
  const CERT = ['verified', 'documented', 'unverified', 'draft', 'deprecated'];
  const FACET_TITLES = { layer: 'Layer', assetType: 'Asset type', system: 'System', platform: 'Platform', environment: 'Environment', database: 'Database', schema: 'Schema', domain: 'Domain', owner: 'Owner', certification: 'Certification', status: 'Status', reviewState: 'Review state', classification: 'Classification', tag: 'Tags', glossaryTerm: 'Glossary term' };
  const FACET_PARAM = { domain: 'domains', owner: 'owners', tag: 'tags', layer: 'layers', assetType: 'assetTypes', system: 'systems', platform: 'platforms', environment: 'environments', database: 'databases', schema: 'schemas', certification: 'certifications', status: 'statuses', reviewState: 'reviewStates', classification: 'classifications', glossaryTerm: 'glossaryTerms' };

  // ── State (kept when the panel is hidden or VS Code restarts the webview) ──
  const saved = vscode.getState() || {};
  const filters = Object.fromEntries(Object.entries(saved.filters || {}).filter(([k]) => FACET_PARAM[k]));
  const state = { view: saved.view || 'explore', query: saved.query || '', filters, history: saved.history || [], pos: saved.pos != null ? saved.pos : -1, tab: saved.tab || 'overview', results: [], total: 0, selected: -1, graph: Object.assign({ hops: 1, columns: true, layout: 'cose', types: [] }, saved.graph || {}), landscape: Object.assign({ scope: '', columns: false, proposed: true, semantic: true, layout: 'cose' }, saved.landscape || {}), factsFilter: saved.factsFilter || {}, lineage: Object.assign({ direction: 'both', depth: 3, level: '', view: 'graph', change: 'rename_column' }, saved.lineage || {}) };
  const persist = () => vscode.setState({ view: state.view, query: state.query, filters: state.filters, history: state.history.slice(-50), pos: Math.min(state.pos, 49), tab: state.tab, graph: state.graph, landscape: state.landscape, factsFilter: state.factsFilter, lineage: state.lineage });

  // ── Requests to the engine ──
  let nextId = 1; const pending = new Map();
  const ask = (request) => new Promise((resolve) => { const id = nextId++; pending.set(id, resolve); vscode.postMessage({ type: 'request', requestId: id, request }); });
  const post = (m) => vscode.postMessage(m);
  window.addEventListener('message', (e) => {
    const m = e.data;
    if (m.type === 'response') { const r = pending.get(m.requestId); if (r) { pending.delete(m.requestId); r(m.body); } else if (m.requestId === 0) onOverview(m.body); }

  function renderLandscapeTools(scopes) {
    const L = state.landscape;
    const find = $('#lFind') ? $('#lFind').value : '';
    const opt = (value, label) => `<option value="${esc(value)}" ${L.scope === value ? 'selected' : ''}>${esc(label)}</option>`;
    $('#lTools').innerHTML = `<label>Scope <select id="lScope">${opt('', 'Whole working set')}
        ${scopes.systems.length ? `<optgroup label="System">${scopes.systems.map((x) => opt('system:' + x.id, `${x.id} (${x.tables})`)).join('')}</optgroup>` : ''}
        ${scopes.schemas.length ? `<optgroup label="Schema">${scopes.schemas.map((x) => opt('schema:' + x.id, `${x.id} (${x.tables})`)).join('')}</optgroup>` : ''}
        ${scopes.models.length ? `<optgroup label="Semantic model">${scopes.models.map((m) => opt('model:' + m.id, m.id + (m.status === 'draft' ? ' (draft)' : ''))).join('')}</optgroup>` : ''}</select></label>
      <label><input type="checkbox" id="lCols" ${L.columns ? 'checked' : ''}> Columns</label>
      <label title="Relationships proposed but not confirmed, and joins of draft semantic models"><input type="checkbox" id="lProposed" ${L.proposed ? 'checked' : ''}> Proposed</label>
      <label><input type="checkbox" id="lSemantic" ${L.semantic ? 'checked' : ''}> Semantic joins</label>
      <label>Layout <select id="lLayout"><option value="cose" ${L.layout === 'cose' ? 'selected' : ''}>Force</option><option value="breadthfirst" ${L.layout === 'breadthfirst' ? 'selected' : ''}>Layered</option><option value="concentric" ${L.layout === 'concentric' ? 'selected' : ''}>Concentric</option><option value="grid" ${L.layout === 'grid' ? 'selected' : ''}>Grid</option></select></label>
      <input type="search" id="lFind" placeholder="Find on canvas" aria-label="Find on canvas" value="${esc(find)}" style="width:160px">
      <span style="flex:1"></span><button class="btn" id="lFit">Fit</button><button class="btn" id="lPng">PNG</button><button class="btn" id="lSvg">SVG</button>`;
  }
  $('#lTools').addEventListener('change', (e) => {
    const L = state.landscape; const id = e.target.id;
    if (id === 'lScope') L.scope = e.target.value; else if (id === 'lCols') L.columns = e.target.checked; else if (id === 'lProposed') L.proposed = e.target.checked; else if (id === 'lSemantic') L.semantic = e.target.checked; else if (id === 'lLayout') L.layout = e.target.value; else return;
    persist(); loadLandscape();
  });
  $('#lTools').addEventListener('input', (e) => { if (e.target.id === 'lFind') findOn('landscape', e.target.value); });
  $('#lTools').addEventListener('click', (e) => {
    const g = graphs.landscape; if (!g) return;
    if (e.target.id === 'lFit') g.fit(undefined, 30);
    else if (e.target.id === 'lPng') exportPng(g);
    else if (e.target.id === 'lSvg') post({ type: 'exportGraph', format: 'svg', data: toSvg(g) });
  });
  $('#lFoot').addEventListener('click', handleLinks);

  /** SVG of a canvas, from node positions (no extra library): tables with columns as boxes, edges as lines. */
  function toSvg(g) {
    const bb = g.elements().boundingBox(); const pad = 30; const w = Math.ceil(bb.w + pad * 2); const h = Math.ceil(bb.h + pad * 2);
    const x = (p) => (p.x - bb.x1 + pad).toFixed(1); const y = (p) => (p.y - bb.y1 + pad).toFixed(1);
    const fg = css('--vscode-foreground', '#333'); const muted = css('--vscode-descriptionForeground', '#888');
    const boxes = g.nodes(':parent').map((n) => { const b = n.boundingBox(); return `<rect x="${(b.x1 - bb.x1 + pad).toFixed(1)}" y="${(b.y1 - bb.y1 + pad).toFixed(1)}" width="${b.w.toFixed(1)}" height="${b.h.toFixed(1)}" rx="6" fill="none" stroke="${n.style('border-color')}" stroke-width="1.5"/><text x="${(b.x1 - bb.x1 + pad + 6).toFixed(1)}" y="${(b.y1 - bb.y1 + pad - 4).toFixed(1)}" font-size="11" font-weight="bold" fill="${fg}" font-family="sans-serif">${esc(n.data('summary').label)}</text>`; });
    const lines = g.edges().map((e) => `<line x1="${x(e.source().position())}" y1="${y(e.source().position())}" x2="${x(e.target().position())}" y2="${y(e.target().position())}" stroke="${muted}" stroke-width="1.2"${e.data('proposed') || /derives_from|maps_to/.test(e.data('type')) ? ' stroke-dasharray="5,3"' : e.data('type') === 'contains' || e.data('type') === 'semantic_join' ? ' stroke-dasharray="2,3"' : ''}/>`);
    const dots = g.nodes(':childless').map((n) => { const p = n.position(); return `<g><circle cx="${x(p)}" cy="${y(p)}" r="${/column|dimension|fact|filter/.test(n.data('type')) ? 6 : 11}" fill="white" stroke="${n.style('border-color')}" stroke-width="2"/><text x="${x(p)}" y="${(Number(y(p)) + 22).toFixed(1)}" font-size="10" text-anchor="middle" fill="${fg}" font-family="sans-serif">${esc(n.data('summary').label)}</text></g>`; });
    return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${boxes.join('')}${lines.join('')}${dots.join('')}</svg>`;
  }

  // ── Facts view ──
  async function loadFacts() {
    const f = state.factsFilter;
    const body = await ask({ type: 'facts', limit: 200, ...(f.text ? { text: f.text } : {}), ...(f.kind ? { kinds: [f.kind] } : {}), ...(f.status ? { statuses: [f.status] } : {}), ...(f.trust ? { trust: [f.trust] } : {}) });
    const r = body.result; if (!r) return;
    const opt = (name, values, cur, title) => `<select data-ff="${name}" aria-label="${title}"><option value="">Any ${title}</option>${Object.entries(values).sort((a, b) => b[1] - a[1]).map(([v, n]) => `<option value="${esc(v)}" ${cur === v ? 'selected' : ''}>${esc(v)} (${n})</option>`).join('')}</select>`;
    $('#factsPage').innerHTML = `<div class="toolbar"><input type="text" data-ff="text" placeholder="Filter by statement or subject" value="${esc(f.text || '')}" aria-label="Filter facts" style="min-width:260px">${opt('kind', r.facets.kind, f.kind, 'type')}${opt('status', r.facets.status, f.status, 'review state')}${opt('trust', r.facets.trust, f.trust, 'evidence')}<span class="muted small">${r.total} fact(s)${r.rows.length < r.total ? `, first ${r.rows.length}` : ''}</span><span style="flex:1"></span><button class="btn primary" data-open="inbox">Review in the Context Inbox</button></div>
      ${r.rows.length ? `<table class="grid"><thead><tr><th>Statement</th><th>Type</th><th>About</th><th>Review state</th><th>Evidence</th><th>By</th><th>Since</th></tr></thead><tbody>${r.rows.map((x) => `<tr class="click" data-asset="${esc(x.id)}" tabindex="0"><td>${esc(x.statement)}</td><td>${esc(x.kind)}</td><td class="small">${esc(x.subjects.join(', '))}</td><td>${esc(x.status.replace(/_/g, ' '))}</td><td>${trustBadge(x.trust)}</td><td class="small">${esc(x.createdBy)}</td><td class="small">${esc((x.validFrom || '').slice(0, 10))}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">No facts match.</div>'}`;
  }
  let factsTimer;
  $('#factsPage').addEventListener('input', (e) => { const k = e.target.dataset.ff; if (!k) return; state.factsFilter[k] = e.target.value || undefined; persist(); clearTimeout(factsTimer); factsTimer = setTimeout(loadFacts, k === 'text' ? 250 : 0); });
  $('#factsPage').addEventListener('click', handleLinks);
  $('#factsPage').addEventListener('keydown', (e) => { if (e.key === 'Enter') { const row = e.target.closest('tr[data-asset]'); if (row) openAsset(row.dataset.asset); } });

  // ── Estate view ──
  async function loadEstate() {
    const body = await ask({ type: 'estate' }); const est = body.estate; if (!est) return;
    const pill = (r) => `<span class="badge ${r === 'ready' ? 'trust trust-verified' : r === 'failed' ? 'pii' : ''}">${esc(r)}</span>`;
    $('#estatePage').innerHTML = `<h2 style="margin:0 0 8px">Estate</h2>
      ${est.errors.length ? `<div class="note warn">${est.errors.map(esc).join('<br>')}</div>` : ''}
      ${est.systems.length ? `<div class="cards">${est.systems.map((s) => `<div class="card"><h3>${esc(s.name)} <span class="badge">${esc(s.role)}</span></h3>${s.environments.length ? `<table class="grid"><thead><tr><th>Environment</th><th>Tables</th><th>In working set</th><th>Not visible</th></tr></thead><tbody>${s.environments.map((e) => `<tr class="click" data-system="${esc(s.id)}"><td>${esc(e.environment)}</td><td>${e.tables}</td><td>${e.inWorkingSet}</td><td>${e.notVisible || ''}</td></tr>`).join('')}</tbody></table>` : '<div class="muted small">Nothing loaded from it yet.</div>'}</div>`).join('')}</div>` : '<div class="empty">No systems yet: ingest a file or connect a platform.</div>'}
      <h4>Connections</h4>${est.connections.length ? `<table class="grid"><thead><tr><th>Connection</th><th>Platform</th><th>Role</th><th>Ready</th><th>Checked</th></tr></thead><tbody>${est.connections.map((c) => `<tr><td class="mono">${esc(c.id)}</td><td>${esc(c.platform)}</td><td>${esc(c.role)}</td><td>${pill(c.readiness)}${c.detail ? `<div class="small muted">${esc(c.detail)}</div>` : ''}</td><td class="small">${esc((c.checkedAt || '').slice(0, 16).replace('T', ' '))}</td></tr>`).join('')}</tbody></table>` : '<div class="muted small">None in .autode/config/connections.yaml.</div>'}
      ${est.bindings.length ? `<h4>What feeds each system</h4><table class="grid"><thead><tr><th>System</th><th>Environment</th><th>From</th><th>Schemas</th></tr></thead><tbody>${est.bindings.map((b) => `<tr><td>${esc(b.system)}</td><td>${esc(b.environment || 'default')}</td><td class="mono">${esc(b.connection || b.file || '')}</td><td class="small">${esc((b.schemas || []).join(', '))}</td></tr>`).join('')}</tbody></table>` : ''}`;
  }
  $('#estatePage').addEventListener('click', (e) => { const sys = e.target.closest('[data-system]'); if (sys) { setView('explore'); } handleLinks(e); });

  updateHistory();
  post({ type: 'ready' });
})();
</script>
</body>
</html>
