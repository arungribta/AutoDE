# Customer 360 — data contract, in the client data office's own format (not a standard).
# Source A (shop.customers) conforms. Source B (crm.customers) violates it in four planted
# places: a type (created), a nullability (email), a missing column (country) and a
# duplicate key in its sample (customer_ref).
contract_header:
  title: Customer 360 merge
  revision: 1
  steward: Data Office
  status: signed
data_objects:
  - object: customer
    summary: One record per customer across the shop and CRM systems.
    realised_by: [shop.customers, crm.customers]
    elements:
      - element: customer_ref
        mandatory: Y
        unique_id: Y
        physical: { shop: customer_id, crm: cust_no }
      - element: email
        kind: text(255)
        mandatory: Y
      - element: phone
        kind: text(32)
        mandatory: N
      - element: country
        kind: text(2)
        mandatory: N
        physical: { shop: country_code, crm: country_code }
      - element: created
        kind: timestamp
        mandatory: N
        physical: { shop: created_at, crm: created_date }
    checks:
      - on: email
        rule: no blanks
