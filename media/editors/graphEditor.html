<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
:root { color-scheme: light dark; }
body { background: var(--vscode-editor-background, #1f1f1f); color: var(--vscode-editor-foreground, #cccccc); font-family: var(--vscode-editor-font-family, "Consolas", monospace); font-size: 13px; padding: 16px; line-height: 1.6; margin: 0; }
.header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 12px; border-bottom: 1px solid var(--vscode-panel-border, rgba(255,255,255,0.12)); margin-bottom: 16px; }
.header h1 { font-size: 16px; font-weight: 600; margin: 0; }
.header .badge { font-size: 11px; padding: 2px 8px; border-radius: 12px; background: rgba(14,99,156,0.15); color: #58a6ff; }
.stats { display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
.stat-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 6px; padding: 12px 16px; min-width: 100px; }
.stat-card .stat-value { font-size: 24px; font-weight: 700; color: #58a6ff; }
.stat-card .stat-label { font-size: 11px; color: var(--vscode-descriptionForeground, #9d9d9d); margin-top: 4px; }
pre { background: rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.08); border-radius: 6px; padding: 16px; overflow-x: auto; white-space: pre-wrap; word-break: break-word; max-height: 500px; overflow-y: auto; }
.json-key { color: #9cdcfe; }
.json-string { color: #ce9178; }
.json-number { color: #b5cea8; }
</style>
</head>
<body>
<div class="header">
  <h1>🔗 Knowledge Graph: {{FILENAME}}</h1>
  <span class="badge">AutoDE Editor</span>
</div>
<div class="stats" id="stats"></div>
<pre id="content"></pre>
<script>
(function() {
  var content = `{{CONTENT}}`;
  var el = document.getElementById('content');
  var statsEl = document.getElementById('stats');
  try {
    var data = JSON.parse(content);
    var nodes = data.nodes || [];
    var edges = data.edges || [];
    var tables = nodes.filter(function(n) { return n.type === 'table'; });
    var columns = nodes.filter(function(n) { return n.type === 'column'; });
    var views = nodes.filter(function(n) { return n.type === 'semantic_view'; });
    statsEl.innerHTML =
      '<div class="stat-card"><div class="stat-value">' + nodes.length + '</div><div class="stat-label">Total Nodes</div></div>' +
      '<div class="stat-card"><div class="stat-value">' + tables.length + '</div><div class="stat-label">Tables</div></div>' +
      '<div class="stat-card"><div class="stat-value">' + columns.length + '</div><div class="stat-label">Columns</div></div>' +
      '<div class="stat-card"><div class="stat-value">' + edges.length + '</div><div class="stat-label">Edges</div></div>' +
      '<div class="stat-card"><div class="stat-value">' + views.length + '</div><div class="stat-label">Views</div></div>';
  } catch(e) { statsEl.innerHTML = ''; }
  var highlighted = JSON.stringify(JSON.parse(content), null, 2)
    .replace(/"([^"]+)":/g, '<span class="json-key">"$1"</span>:')
    .replace(/: "([^"]*)"/g, ': <span class="json-string">"$1"</span>')
    .replace(/: (\d+)/g, ': <span class="json-number">$1</span>');
  el.innerHTML = highlighted;
})();
</script>
</body>
</html>
