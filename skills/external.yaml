    summary: Working with Databricks SQL warehouses.
    usedFor: { stageKinds: [build, validate, reconcile], platforms: [databricks] }
  - id: databricks-unity-catalog
    vendor: Databricks
    source: https://github.com/databricks/databricks-agent-skills/tree/main/skills/databricks-unity-catalog
    licence: databricks-license
    availability: installable
