# AutoDE platform operation (docs/specs/platform-operations.md §6.1): LIN's observed lineage on Databricks.
formatVersion: 1
id: lineage.column_lineage
title: Column lineage from Unity Catalog
description: Each column written from other columns, over the last days, for the catalogs named (Unity Catalog workloads only). Object and column names only.
kind: read
content: metadata
area: lineage
params:
  - { name: databases, type: literal_list, label: Catalogs }
  - { name: days, type: number, label: Days back, default: 30, min: 1, max: 365 }
  - { name: limit, type: number, label: Row limit, default: 5000, min: 1, max: 20001 }
returns:
  - { name: upstream_object, label: Source table }
  - { name: upstream_column, label: Source column }
  - { name: downstream_object, label: Target table }
  - { name: downstream_column, label: Target column }
  - { name: runs, as: number, label: Events }
platforms:
  databricks:
    sql: >
      SELECT
        source_table_full_name AS upstream_object,
        source_column_name AS upstream_column,
        target_table_full_name AS downstream_object,
        target_column_name AS downstream_column,
        COUNT(*) AS runs
      FROM system.access.column_lineage
      WHERE event_time >= current_timestamp() - INTERVAL {days} DAYS
        AND source_table_full_name IS NOT NULL
        AND target_table_full_name IS NOT NULL
        AND (lower(split_part(target_table_full_name, '.', 1)) IN ({databases:lower})
          OR lower(split_part(source_table_full_name, '.', 1)) IN ({databases:lower}))
      GROUP BY 1, 2, 3, 4
      ORDER BY runs DESC
      LIMIT {limit}
example:
  params: { databases: [retail] }
  rows:
    - { upstream_object: retail.sales.orders, upstream_column: amount, downstream_object: retail.mart.fct_orders, downstream_column: net_amount, runs: 12 }
