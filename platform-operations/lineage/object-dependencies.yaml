# AutoDE platform operation (docs/specs/platform-operations.md §6.1): LIN's observed lineage on Snowflake.
formatVersion: 1
id: lineage.object_dependencies
title: View dependencies
description: Views, materialized views and dynamic tables over the objects they read (their current definitions), for the databases named. Object names only.
kind: read
content: metadata
area: lineage
params:
  - { name: databases, type: literal_list, label: Databases }
  - { name: limit, type: number, label: Row limit, default: 5000, min: 1, max: 20001 }
returns:
  - { name: upstream_object, label: Object read }
  - { name: downstream_object, label: View }
platforms:
  snowflake:
    sql: >
      SELECT
        referenced_database || '.' || referenced_schema || '.' || referenced_object_name AS upstream_object,
        referencing_database || '.' || referencing_schema || '.' || referencing_object_name AS downstream_object
      FROM SNOWFLAKE.ACCOUNT_USAGE.OBJECT_DEPENDENCIES
      WHERE referencing_object_domain IN ('VIEW', 'MATERIALIZED VIEW', 'DYNAMIC TABLE')
        AND referenced_object_domain IN ('TABLE', 'VIEW', 'MATERIALIZED VIEW', 'DYNAMIC TABLE', 'EXTERNAL TABLE')
        AND (LOWER(referencing_database) IN ({databases:lower}) OR LOWER(referenced_database) IN ({databases:lower}))
      LIMIT {limit}
example:
  params: { databases: [RETAIL] }
  rows:
    - { UPSTREAM_OBJECT: RETAIL.MART.FCT_ORDERS, DOWNSTREAM_OBJECT: RETAIL.REPORTING.V_DAILY_REVENUE }
