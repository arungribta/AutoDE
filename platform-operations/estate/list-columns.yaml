# AutoDE platform operation (docs/specs/platform-operations.md §6.2): the columns of one schema's tables and views.
formatVersion: 1
id: estate.list_columns
title: Columns in a schema
description: Every column of one schema's tables and views, with its type, nullability, position, default and comment. Column names and types only. With tables, only those tables' columns.
kind: read
content: metadata
area: estate
params:
  - { name: database, type: identifier, label: Database (catalog) }
  - { name: schema, type: literal, label: Schema }
  - { name: tables, type: literal_list, label: Only these tables, required: false }
returns:
  - { name: table_catalog, label: Database }
  - { name: table_schema, label: Schema }
  - { name: table_name, label: Table }
  - { name: column_name, label: Column }
  - { name: data_type, label: Type }
  - { name: is_nullable, label: "Nullable (YES or NO)" }
  - { name: ordinal_position, as: number, label: Position }
  - { name: column_default, label: Default }
  - { name: comment, label: Comment }
platforms:
  snowflake:
    sql: >
      SELECT table_catalog, table_schema, table_name, column_name, data_type, is_nullable, ordinal_position, comment, column_default
      FROM {database}.INFORMATION_SCHEMA.COLUMNS
      WHERE table_schema = {schema:literal}[[ AND UPPER(table_name) IN ({tables:upper})]]
      ORDER BY table_name, ordinal_position
  databricks:
    sql: >
      SELECT table_catalog, table_schema, table_name, column_name, data_type, is_nullable, ordinal_position, comment, column_default
      FROM {database}.information_schema.columns
      WHERE table_schema = {schema:literal}[[ AND lower(table_name) IN ({tables:lower})]]
      ORDER BY table_name, ordinal_position
  redshift:
    sql: >
      SELECT database_name AS table_catalog, schema_name AS table_schema, table_name, column_name,
        CASE
          WHEN character_maximum_length IS NOT NULL THEN data_type || '(' || CAST(character_maximum_length AS VARCHAR) || ')'
          WHEN data_type = 'numeric' AND numeric_precision IS NOT NULL THEN 'numeric(' || CAST(numeric_precision AS VARCHAR) || ',' || CAST(COALESCE(numeric_scale, 0) AS VARCHAR) || ')'
          ELSE data_type
        END AS data_type,
        is_nullable, ordinal_position, column_default, remarks AS comment
      FROM svv_all_columns
      WHERE database_name = {database:lower} AND schema_name = {schema:lower}[[ AND table_name IN ({tables:lower})]]
      ORDER BY table_name, ordinal_position
example:
  platform: redshift
  params: { database: dev, schema: sales }
  rows:
    - { table_catalog: dev, table_schema: sales, table_name: orders, column_name: order_id, data_type: bigint, is_nullable: 'NO', ordinal_position: 1, column_default: null, comment: null }
    - { table_catalog: dev, table_schema: sales, table_name: orders, column_name: amount, data_type: 'numeric(12,2)', is_nullable: 'YES', ordinal_position: 2, column_default: null, comment: Order total }
