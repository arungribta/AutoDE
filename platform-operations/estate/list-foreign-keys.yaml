# AutoDE platform operation (docs/specs/platform-operations.md §6.2): declared foreign keys touching one schema.
formatVersion: 1
id: estate.list_foreign_keys
title: Foreign keys in a schema
description: Each declared foreign-key column and the column it references, where either side is in the schema. Where the platform doesn't enforce keys (Snowflake, Databricks, Redshift), they are what was declared, which probes can check.
kind: read
content: metadata
area: estate
params:
  - { name: database, type: identifier, label: Database (catalog) }
  - { name: schema, type: literal, label: Schema }
returns:
  - { name: constraint_name, label: Constraint }
  - { name: source_schema, label: Schema }
  - { name: source_table, label: Table }
  - { name: source_column, label: Column }
  - { name: target_schema, label: Referenced schema }
  - { name: target_table, label: Referenced table }
  - { name: target_column, label: Referenced column }
platforms:
  snowflake:
    sql: >
      SELECT fk_schema_name AS source_schema, fk_table_name AS source_table, fk_column_name AS source_column,
        pk_schema_name AS target_schema, pk_table_name AS target_table, pk_column_name AS target_column, constraint_name
      FROM {database}.INFORMATION_SCHEMA.REFERENTIAL_CONSTRAINTS
      WHERE fk_schema_name = {schema:literal} OR pk_schema_name = {schema:literal}
  databricks:
    sql: >
      SELECT kcu.constraint_schema AS source_schema, kcu.table_name AS source_table, kcu.column_name AS source_column,
        ccu.constraint_schema AS target_schema, ccu.table_name AS target_table, ccu.column_name AS target_column, kcu.constraint_name
      FROM {database}.information_schema.key_column_usage kcu
      JOIN {database}.information_schema.constraint_column_usage ccu ON kcu.constraint_name = ccu.constraint_name
      WHERE kcu.constraint_schema = {schema:literal}
  # information_schema covers the connected database only. A key over several columns pairs them by position
  # only where the platform says so; here each column is listed against each referenced column.
  redshift:
    sql: >
      SELECT tc.constraint_name, kcu.table_schema AS source_schema, kcu.table_name AS source_table, kcu.column_name AS source_column,
        ccu.table_schema AS target_schema, ccu.table_name AS target_table, ccu.column_name AS target_column
      FROM information_schema.table_constraints tc
      JOIN information_schema.key_column_usage kcu
        ON kcu.constraint_name = tc.constraint_name AND kcu.table_schema = tc.table_schema AND kcu.table_name = tc.table_name
      JOIN information_schema.constraint_column_usage ccu
        ON ccu.constraint_name = tc.constraint_name AND ccu.constraint_schema = tc.constraint_schema
      WHERE tc.constraint_type = 'FOREIGN KEY'
        AND (kcu.table_schema = {schema:lower} OR ccu.table_schema = {schema:lower})
        AND current_database() = {database:lower}
example:
  platform: redshift
  params: { database: dev, schema: sales }
  rows:
    - { constraint_name: orders_customer_fk, source_schema: sales, source_table: orders, source_column: customer_id, target_schema: sales, target_table: customers, target_column: customer_id }
