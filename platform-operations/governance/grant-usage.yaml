# AutoDE platform operation (docs/specs/platform-operations.md §6.2b): let a role use a schema (see its objects).
# A change: it becomes a runbook step a person approves.
formatVersion: 1
id: governance.grant_usage
title: Grant use of a schema
description: Lets a role use a schema, the first step of read access (then governance.grant_select). A change, run only as an approved runbook step.
kind: change
area: governance
params:
  - { name: schema, type: identifier, label: Schema }
  - { name: role, type: identifier, label: Role }
returns: []
platforms:
  redshift:
    sql: GRANT USAGE ON SCHEMA {schema} TO ROLE {role}
