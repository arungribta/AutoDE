# AutoDE platform operation (docs/specs/platform-operations.md §6.1): LIN's observed object lineage.
# One operation, an implementation per platform. A new platform adds its block here.
formatVersion: 1
id: lineage.objects
title: Object lineage
description: Each table or view built from other objects, and where the platform records it, the job, notebook, pipeline or dashboard that moved or read the data, for the databases named (Databricks catalogs, Oracle schemas). Object names and entity ids only.
kind: read
content: metadata
area: lineage
params:
  - { name: databases, type: literal_list, label: Databases, description: "Databases, Databricks catalogs, or Oracle schemas (owners)." }
  - { name: days, type: number, label: Days back, default: 30, min: 1, max: 365, description: Where the platform records events over time (Databricks); definitions are read as they are now. }
  - { name: limit, type: number, label: Row limit, default: 5000, min: 1, max: 20001 }
returns:
  - { name: upstream_object, label: Object read }
  - { name: downstream_object, label: Object built }
  - { name: entity_type, label: What moved or read it }
  - { name: entity_id, label: Its id }
  - { name: runs, as: number, label: Times seen }
platforms:
  # Snowflake: views, materialized views and dynamic tables over the objects they read (their current definitions).
  snowflake:
    sql: >
      SELECT
        referenced_database || '.' || referenced_schema || '.' || referenced_object_name AS upstream_object,
        referencing_database || '.' || referencing_schema || '.' || referencing_object_name AS downstream_object
      FROM SNOWFLAKE.ACCOUNT_USAGE.OBJECT_DEPENDENCIES
      WHERE referencing_object_domain IN ('VIEW', 'MATERIALIZED VIEW', 'DYNAMIC TABLE')
        AND referenced_object_domain IN ('TABLE', 'VIEW', 'MATERIALIZED VIEW', 'DYNAMIC TABLE', 'EXTERNAL TABLE')
        AND (LOWER(referencing_database) IN ({databases:lower}) OR LOWER(referenced_database) IN ({databases:lower}))
      LIMIT {limit}
  # Databricks: Unity Catalog's table lineage, with the job, notebook, pipeline, dashboard or query (a row with no target: it only read).
  databricks:
    sql: >
      SELECT
        source_table_full_name AS upstream_object,
        target_table_full_name AS downstream_object,
        entity_type AS entity_type,
        entity_id AS entity_id,
        COUNT(*) AS runs
      FROM system.access.table_lineage
      WHERE event_time >= current_timestamp() - INTERVAL {days} DAYS
        AND source_table_full_name IS NOT NULL
        AND (target_table_full_name IS NOT NULL OR entity_id IS NOT NULL)
        AND (lower(split_part(coalesce(target_table_full_name, source_table_full_name), '.', 1)) IN ({databases:lower})
          OR lower(split_part(source_table_full_name, '.', 1)) IN ({databases:lower}))
      GROUP BY 1, 2, 3, 4
      ORDER BY runs DESC
      LIMIT {limit}
  # Oracle: views and materialized views over the objects they read, from the dictionary (schemas are owners).
  oracle:
    sql: >
      SELECT
        referenced_owner || '.' || referenced_name AS upstream_object,
        owner || '.' || name AS downstream_object
      FROM all_dependencies
      WHERE type IN ('VIEW', 'MATERIALIZED VIEW')
        AND referenced_type IN ('TABLE', 'VIEW', 'MATERIALIZED VIEW')
        AND (LOWER(owner) IN ({databases:lower}) OR LOWER(referenced_owner) IN ({databases:lower}))
      FETCH FIRST {limit} ROWS ONLY
example:
  platform: databricks
  params: { databases: [retail] }
  rows:
    - { upstream_object: retail.sales.orders, downstream_object: retail.mart.fct_orders, entity_type: PIPELINE, entity_id: p-42, runs: 30 }
    - { upstream_object: retail.mart.fct_orders, downstream_object: null, entity_type: DASHBOARD_V3, entity_id: d-7, runs: 4 }
