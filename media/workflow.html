<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src {{cspSource}} data:; style-src {{cspSource}} 'unsafe-inline'; script-src 'nonce-{{nonce}}';">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoDE Workflow</title>
<style>
  :root { --gap: 12px; --radius: 6px; }
  body { font-family: var(--vscode-font-family); font-size: var(--vscode-font-size); color: var(--vscode-foreground); background: var(--vscode-editor-background); margin: 0; padding: 16px 20px; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  .statement { opacity: 0.85; margin-bottom: 8px; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; opacity: 0.8; }
  .prov { margin: 8px 0 12px; padding: 8px 10px; border-left: 3px solid var(--vscode-textLink-foreground); background: var(--vscode-textBlockQuote-background); font-size: 12px; }
  .prov div { margin: 2px 0; }
  .progress { height: 6px; background: var(--vscode-editorWidget-border, #444); border-radius: 3px; overflow: hidden; margin: 8px 0 14px; }
  .progress > div { height: 100%; background: var(--vscode-testing-iconPassed, #2ea043); }
  .layout { display: grid; grid-template-columns: minmax(0, 3fr) minmax(280px, 2fr); gap: var(--gap); align-items: start; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
  .board { display: flex; gap: var(--gap); overflow-x: auto; padding-bottom: 6px; }
  .col { min-width: 170px; display: flex; flex-direction: column; gap: 8px; }
  .col-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; opacity: 0.6; }
  .card { border: 1px solid var(--vscode-editorWidget-border, #555); border-radius: var(--radius); padding: 8px 10px; cursor: pointer; background: var(--vscode-editorWidget-background); }
  .card:focus-visible, .card.sel { outline: 2px solid var(--vscode-focusBorder); }
  .card .t { font-weight: 600; }
  .card .s { font-size: 11px; opacity: 0.8; margin-top: 2px; }
  .st-done { border-left: 4px solid var(--vscode-testing-iconPassed, #2ea043); }
  .st-ready, .st-in-progress { border-left: 4px solid var(--vscode-textLink-foreground); }
  .st-awaiting-approval, .st-awaiting-check { border-left: 4px solid var(--vscode-editorWarning-foreground, #cca700); }
  .st-stale { border-left: 4px solid var(--vscode-editorError-foreground, #f14c4c); }
  .st-skipped { opacity: 0.55; border-style: dashed; }
  .st-pending { border-left: 4px solid var(--vscode-disabledForeground, #888); }
  .panel { border: 1px solid var(--vscode-editorWidget-border, #555); border-radius: var(--radius); padding: 12px; background: var(--vscode-editorWidget-background); }
  .panel h2 { font-size: 14px; margin: 0 0 6px; }
  .kv { display: grid; grid-template-columns: 110px 1fr; gap: 4px 8px; font-size: 12px; margin: 8px 0; }
  .kv div:nth-child(odd) { opacity: 0.7; }
  .hist { font-size: 12px; margin: 6px 0 0; padding-left: 16px; }
  .hist li { margin: 3px 0; }
  .muted { opacity: 0.7; font-size: 12px; }
  button { font-family: inherit; font-size: 12px; padding: 4px 10px; margin: 6px 6px 0 0; border: 1px solid var(--vscode-button-border, transparent); border-radius: 3px; cursor: pointer; color: var(--vscode-button-secondaryForeground); background: var(--vscode-button-secondaryBackground); }
  button.primary { color: var(--vscode-button-foreground); background: var(--vscode-button-background); }
  button:disabled { opacity: 0.5; cursor: default; }
  select { font-family: inherit; font-size: 12px; padding: 3px; color: var(--vscode-dropdown-foreground); background: var(--vscode-dropdown-background); border: 1px solid var(--vscode-dropdown-border); }
  a { color: var(--vscode-textLink-foreground); cursor: pointer; }
  .guide { margin: 8px 0; padding: 6px 8px; border-radius: 4px; background: var(--vscode-textBlockQuote-background); font-size: 12px; }
  .proposal td, .proposal th { text-align: left; font-size: 12px; padding: 3px 8px 3px 0; vertical-align: top; }
  .out { opacity: 0.6; }
  .tag { display: inline-block; font-size: 10px; padding: 0 6px; border-radius: 8px; border: 1px solid currentColor; opacity: 0.8; margin-left: 4px; }
</style>
</head>
<body>
<div id="root"><p class="muted">Loading the workflow…</p></div>
<script nonce="{{nonce}}">
(function () {
  const vscode = acquireVsCodeApi();
  const root = document.getElementById('root');
  let state = { model: null, details: {}, selected: null };
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const MARK = { done: '✓', ready: '→', 'in-progress': '…', 'awaiting-approval': '?', 'awaiting-check': '?', pending: '·', stale: '!', skipped: '−' };
  const ACTION_LABEL = { approve: 'Approve…', 'approve-document': 'Approve…', run: 'Run agent', 'open-document': 'Open document', 'hand-in': 'Hand in…', 'approve-again': 'Approve again…', skip: 'Skip…', reopen: 'Re-open…' };
  const send = (m) => vscode.postMessage(m);
  const when = (iso) => iso ? String(iso).slice(0, 16).replace('T', ' ') : '';

  function render() {
    const m = state.model;
    if (!m) { root.innerHTML = '<p class="muted">' + esc(state.error || 'Start or open a business problem to see its workflow.') + '</p>'; return; }
    const pct = m.progress.total ? Math.round(100 * m.progress.done / m.progress.total) : 0;
    let h = '<h1>' + esc(m.problemId) + '</h1><div class="statement">' + esc(m.statement) + '</div>' +
      '<div class="meta"><span>Template: <b>' + esc(m.template) + '</b></span><span>' + (m.approved ? 'Workflow approved' : 'Workflow not approved yet') + '</span><span>' + m.progress.done + ' of ' + m.progress.total + ' stages done</span>' +
      (m.next ? '<span>Next: <b>' + esc(m.next.title) + '</b> (' + esc(m.next.status) + ')</span>' : '') + '</div>' +
      '<div class="progress" role="progressbar" aria-valuenow="' + pct + '" aria-valuemin="0" aria-valuemax="100"><div style="width:' + pct + '%"></div></div>';
    if (m.provenance.length) h += '<div class="prov">' + m.provenance.map((p) => '<div>' + esc(p) + '</div>').join('') + '<div><a data-history="1">Full history</a></div></div>';
    if (!m.approved) {
      h += '<div class="panel"><h2>Plan the workflow</h2>';
      if (m.proposal) {
        const p = m.proposal;
        h += '<div class="muted">Proposed: ' + esc(p.template) + '. Review what is in and what is left out, then approve it.</div>' +
          '<table class="proposal"><tr><th>Stage</th><th>Kind</th><th>Inclusion</th><th>In the workflow</th></tr>' + p.stages.map((x) =>
            '<tr class="' + (x.included ? '' : 'out') + '"><td>' + esc(x.title) + (x.origin === 'added' ? '<span class="tag">added</span>' : '') + '</td><td>' + esc(x.kind) + '</td><td>' + esc(x.inclusion) + '</td><td>' +
            (x.included ? 'yes' + (x.systems && x.systems.length ? ' (per source system: ' + x.systems.map(esc).join(', ') + ')' : '') : 'no — ' + esc(x.reason || 'optional, not included')) + '</td></tr>').join('') + '</table>' +
          (p.errors.length ? '<div class="guide">The engine refuses it: ' + p.errors.map(esc).join(' ') + '</div>' : '');
      }
      if (m.pendingWorkflowDecision) {
        h += '<div class="muted">Waiting for a person: ' + esc(m.pendingWorkflowDecision.title) + '</div>' +
          '<button class="primary" data-decide="approve" data-id="' + esc(m.pendingWorkflowDecision.id) + '">Approve workflow…</button><button data-decide="reject" data-id="' + esc(m.pendingWorkflowDecision.id) + '">Reject…</button><button data-open-decision="' + esc(m.pendingWorkflowDecision.id) + '">Open decision</button>';
      } else {
        h += '<div class="muted">The engine drafts the stages from a template and what it knows about the specification and estate; you review and approve it.</div>';
      }
      h += '<div><select id="tpl">' + m.templates.map((t) => '<option value="' + esc(t.id) + '"' + (m.template.indexOf(t.id + ' ') === 0 ? ' selected' : '') + '>' + esc(t.title) + '</option>').join('') + '</select><button data-propose="1">' + (m.pendingWorkflowDecision ? 'Re-draft' : 'Draft the workflow') + '</button></div></div>';
    }
    // Board: one column per dependency step.
    const cols = {};
    m.stages.forEach((s) => { (cols[s.level] = cols[s.level] || []).push(s); });
    h += '<div class="layout"><div><div class="board" role="list">' + Object.keys(cols).sort((a, b) => a - b).map((lv) =>
      '<div class="col"><div class="col-title">Step ' + (Number(lv) + 1) + '</div>' + cols[lv].map((s) =>
        '<div class="card st-' + esc(s.status) + (state.selected === s.id ? ' sel' : '') + '" tabindex="0" role="listitem" data-stage="' + esc(s.id) + '" aria-label="' + esc(s.title + ', ' + s.status) + '">' +
        '<div class="t">' + (MARK[s.status] || '') + ' ' + esc(s.title) + (s.origin === 'added' ? '<span class="tag">added</span>' : '') + (s.manual ? '<span class="tag" title="No AutoDE agent does this stage yet: a person does it and hands it in.">manual</span>' : '') + '</div>' +
        '<div class="s">' + esc(s.status) + '</div><div class="s">' + esc(s.guide) + '</div></div>').join('') + '</div>').join('') + '</div>';
    h += '</div>';
    // Detail of the selected stage.
    const s = m.stages.find((x) => x.id === state.selected) || m.stages[0];
    const d = s && state.details[s.id];
    if (s) {
      h += '<div class="panel" aria-live="polite"><h2>' + (MARK[s.status] || '') + ' ' + esc(s.title) + '</h2><div class="muted">' + esc(s.status) + (s.why ? ' — ' + esc(s.why) : '') + '</div>' +
        '<div class="guide"><b>Next:</b> ' + esc(s.guide) + '</div>' +
        '<div class="kv"><div>Kind</div><div>' + esc(s.kind) + '</div><div>Inclusion</div><div>' + esc(s.inclusion) + (s.origin === 'added' ? ' (added by the plan)' : '') + '</div>' +
        '<div>Agent</div><div>' + esc(s.role || '—') + (s.tier ? ' · tier ' + esc(s.tier) : '') + ' (ceiling ' + esc(s.ceiling) + ')' + (s.runner ? '<br>runs here: ' + esc(s.runner) : '') + '</div>' +
        (s.brief ? '<div>Brief</div><div>' + esc(s.brief) + '</div>' : '') +
        (s.document ? '<div>Document</div><div><a data-file="' + esc(s.document) + '">' + esc(s.document) + '</a></div>' : '') +
        (s.runbooks && s.runbooks.length ? '<div>Runbooks</div><div>' + s.runbooks.map((r) => '<a data-runbook="' + esc(r.id) + '">' + esc(r.id) + '</a> (' + esc(r.status) + ')').join('<br>') + '</div>' : '') +
        '<div>After</div><div>' + (s.after.length ? s.after.map(esc).join(', ') : 'nothing') + '</div>' +
        (d ? '<div>Consumes</div><div>' + (d.consumes.map(esc).join(', ') || 'nothing') + '</div><div>Produces</div><div>' + d.produces.map(esc).join(', ') + '</div><div>Gates</div><div>' + d.gates.map(esc).join(', ') + '</div><div>Done when</div><div>' + esc(d.doneWhen) + '</div>' : '') +
        (s.approvedBy ? '<div>Approved</div><div>by ' + esc(s.approvedBy) + (s.approvedVia ? ' via ' + esc(s.approvedVia) : '') + (s.approvedAt ? ' on ' + esc(when(s.approvedAt)) : '') + '</div>' : '') +
        (d && d.record && d.record.outputs && d.record.outputs.length ? '<div>Outputs</div><div>' + d.record.outputs.map((f) => '<a data-file="' + esc(f) + '">' + esc(f) + '</a>').join('<br>') + '</div>' : '') +
        (s.tasks.length ? '<div>Tasks</div><div>' + s.tasks.map((t) => esc(t.title)).join('<br>') + '</div>' : '') + '</div>';
      h += s.actions.map((x) => x === 'approve' && s.decisionId ? '<button class="primary" data-decide="approve" data-id="' + esc(s.decisionId) + '">Approve…</button><button data-decide="reject" data-id="' + esc(s.decisionId) + '">Reject…</button>' : '<button' + (x === 'approve-document' || x === 'run' ? ' class="primary"' : '') + ' data-act="' + esc(x) + '" data-stage="' + esc(s.id) + '">' + esc(x === 'produce' ? s.produceLabel : (ACTION_LABEL[x] || x)) + '</button>').join('');
      if (d && d.decision) {
        h += '<h2 style="margin-top:12px;">Decision ' + esc(d.decision.id) + ' — ' + esc(d.decision.status) + '</h2><ul class="hist">' + d.decision.events.map((e) => '<li>' + esc(when(e.at)) + ' ' + esc(e.type) + ' by ' + esc(e.actor) + (e.channel ? ' (' + esc(e.channel) + ')' : '') + (e.note ? ' — ' + esc(e.note) : '') + '</li>').join('') + '</ul><a data-open-decision="' + esc(d.decision.id) + '">Open decision file</a>';
      }
      h += '<h2 style="margin-top:12px;">History</h2>' + (d && d.history.length ? '<ul class="hist">' + d.history.map((e) => '<li>' + esc(when(e.at)) + ' <b>' + esc(e.type) + '</b> by ' + esc(e.who) + (e.channel ? ' (' + esc(e.channel) + ')' : '') + (e.reason ? ' — ' + esc(e.reason) : '') + '</li>').join('') + '</ul>' : '<div class="muted">Nothing recorded for this stage yet.</div>') + '</div>';
    }
    h += '</div>';
    root.innerHTML = h;
    root.querySelectorAll('[data-stage].card').forEach((el) => {
      const pick = () => { state.selected = el.getAttribute('data-stage'); send({ type: 'select', stage: state.selected }); render(); };
      el.onclick = pick; el.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } };
    });
    root.querySelectorAll('[data-decide]').forEach((b) => { b.onclick = () => send({ type: b.getAttribute('data-decide'), decisionId: b.getAttribute('data-id') }); });
    root.querySelectorAll('[data-act]').forEach((b) => { b.onclick = () => send({ type: b.getAttribute('data-act'), stage: b.getAttribute('data-stage') }); });
    root.querySelectorAll('[data-open-decision]').forEach((b) => { b.onclick = () => send({ type: 'openDecision', decisionId: b.getAttribute('data-open-decision') }); });
    root.querySelectorAll('[data-file]').forEach((b) => { b.onclick = () => send({ type: 'openFile', file: b.getAttribute('data-file') }); });
    root.querySelectorAll('[data-history]').forEach((b) => { b.onclick = () => send({ type: 'openHistory' }); });
    root.querySelectorAll('[data-runbook]').forEach((b) => { b.onclick = () => send({ type: 'openRunbook', file: b.getAttribute('data-runbook') }); });
    const p = root.querySelector('[data-propose]');
    if (p) p.onclick = () => { p.disabled = true; send({ type: 'propose', template: (document.getElementById('tpl') || {}).value }); };
  }

  window.addEventListener('message', (ev) => {
    const msg = ev.data;
    if (msg.type === 'model') {
      state.model = msg.model; state.details = msg.details || {}; state.error = msg.error;
      if (msg.selected && !state.selected) state.selected = msg.selected;
      if (msg.selected) state.selected = msg.selected;
      render();
    }
  });
  send({ type: 'ready' });
})();
</script>
</body>
</html>
