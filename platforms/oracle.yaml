# AutoDE platform definition (docs/specs/platform-operations.md §2.2). A team's copy in
# .autode/config/platforms/ with the same id replaces this one once a person approves it.
formatVersion: 1
id: oracle
title: Oracle Database
category: warehouse
transports: [sql]
access:
  cli: { command: sql, install: "Oracle SQLcl. Until POP2 moves Oracle to SQLcl, AutoDE reads it through the Node driver you install (the platform card says how)." }
versionOperation: platform.version
dialect:
  identifierQuote: '"'
  unquotedCase: upper
  booleans: ['1', '0']
  # What probes, reconciliation and the dry run write differently here ({…} are filled by AutoDE, already made safe).
  fragments:
    sample: '(SELECT * FROM {table} FETCH FIRST {n} ROWS ONLY) s0'
    regexMatch: 'REGEXP_LIKE(TO_CHAR({column}), {pattern})'
    distinctTuples: emulated
    explain: 'EXPLAIN PLAN FOR {statement}'
    explainResult: 'SELECT plan_table_output AS "plan" FROM TABLE(DBMS_XPLAN.DISPLAY())'
# What a lineage or estate read's "databases" parameter names here: Oracle's schemas (owners).
scopeLevel: schema
capabilities:
  estate:
    support: supported
    privileges: SELECT on the ALL_ views of the schemas in scope.
    note: Read by the adapter until POP2 moves the estate reads to operations.
  profiling:
    support: supported
    privileges: SELECT on the tables profiled (sampled).
  lineage:
    support: partly
    operations: [lineage.objects]
    privileges: Nothing beyond the connection's own access; ALL_DEPENDENCIES shows the objects the user can see.
    note: Views and materialized views from the objects they read. Oracle records no column lineage; that stays designed (mappings and specifications).
  compile.target:
    support: not_applicable
    note: Oracle is supported as a source.
objectKinds: [table, view, materialized_view]
