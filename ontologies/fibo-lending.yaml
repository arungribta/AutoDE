concepts:
  - id: fibo:Account
    label: Account
    definition: container for records associated with a business arrangement for
      regular transactions and services
    iri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/ClientsAndAccounts/Account
    parent: upper:Account
    attributes:
      identifying:
        - account number
      notable:
        - account status
        - balance
        - open date
    hints:
      classifications:
        - confidential
      quality:
        - check: unique
          attribute: account number
    module: FBC/ProductsAndServices/ClientsAndAccounts
  - id: fibo:Borrower
    label: Borrower
    definition: party to a credit agreement that is obligated to repay the amount
      borrowed (principal) with interest and other fees according to the terms
      of the instrument
    iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/Borrower
    parent: upper:Party
    synonyms:
      - debtor
      - obligor
    module: FBC/DebtAndEquities/Debt
  - id: fibo:Collateral
    label: Collateral
    definition: something pledged as security to ensure fulfillment of an obligation
      to another party, to lend money, extend credit, or provision securities
    iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/Collateral
    parent: upper:Product
    synonyms:
      - pledge
      - security
    attributes:
      notable:
        - collateral type
        - collateral value
        - valuation date
    module: FBC/DebtAndEquities/Debt
  - id: fibo:CommercialLoan
    label: Commercial Loan
    definition: loan extended to a corporation, commercial enterprise, joint
      venture, or other organization as opposed to a consumer
    iri: https://spec.edmcouncil.org/fibo/ontology/LOAN/LoansSpecific/CommercialLoans/CommercialLoan
    parent: fibo:Loan
    synonyms:
      - business loan
      - commercial and industrial loan
    module: LOAN/LoansSpecific/CommercialLoans
  - id: fibo:ConsumerLoan
    label: Consumer Loan
    definition: loan to one or more individuals for household, family, or other
      personal expenditures, excluding mortgages and student loans
    iri: https://spec.edmcouncil.org/fibo/ontology/LOAN/LoansSpecific/ConsumerLoans/ConsumerLoan
    parent: fibo:Loan
    synonyms:
      - personal loan
      - retail loan
    module: LOAN/LoansSpecific/ConsumerLoans
  - id: fibo:Contract
    label: Contract
    definition: voluntary, deliberate agreement between competent parties to which
      the parties agree to be legally bound, and for which the parties provide
      valuable consideration
    iri: https://spec.edmcouncil.org/fibo/ontology/FND/Agreements/Contracts/Contract
    parent: upper:Agreement
    attributes:
      identifying:
        - contract identifier
      notable:
        - effective date
        - termination date
    module: FND/Agreements/Contracts
  - id: fibo:Country
    label: Country
    definition: a geopolitical entity representing a country or dependent territory
    iri: https://www.omg.org/spec/LCC/Countries/CountryRepresentation/Country
    parent: upper:Location
    attributes:
      identifying:
        - country code
    hints:
      quality:
        - check: accepted_values
          attribute: country code
          note: ISO 3166-1 codes
    module: LCC/Countries/CountryRepresentation
  - id: fibo:CreditAgreement
    label: Credit Agreement
    definition: contractual agreement in which a debtor receives something of value
      and typically agrees to repay the creditor by some date in the future, in
      some form (e.g., cash, securities, etc.), generally with interest
    iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/CreditAgreement
    parent: fibo:Contract
    relations:
      - verb: hasBorrower
        target: fibo:Borrower
        cardinality: 1..*
      - verb: hasLender
        target: fibo:Lender
        cardinality: 1..*
    module: FBC/DebtAndEquities/Debt
  - id: fibo:CreditEvent
    label: Credit Event
    definition: event signifying a sudden change in credit standing, such as
      bankruptcy or a violation of a bond indenture or loan agreement, that
      raises doubts about the party's ability to meet current or future
      obligations
    iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/CreditEvents/CreditEvent
    parent: upper:Event
    synonyms:
      - default event
    relations:
      - verb: affects
        target: fibo:Loan
        cardinality: 1..*
    attributes:
      notable:
        - event date
        - event type
    module: FBC/DebtAndEquities/CreditEvents
  - id: fibo:CreditFacility
    label: Credit Facility
    definition: credit agreement that allows the borrower to periodically take out
      money over an extended period of time rather than reapplying for a loan
      every time they need funds
    iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/CreditFacility
    parent: fibo:CreditAgreement
    synonyms:
      - credit line
      - facility
      - line of credit
      - master commitment
    attributes:
      identifying:
        - facility identifier
      notable:
        - commitment amount
        - facility limit
        - maturity date
    module: FBC/DebtAndEquities/Debt
  - id: fibo:Customer
    label: Customer
    definition: party that receives or consumes products (goods or services) and has
