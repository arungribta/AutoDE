# A fixed reference plan, shaped like what AutoDE's planner produces for this problem. Offline
# runs execute this plan through AgentHub.executePlan() so artifact generation can be measured
# without an LLM; replay/record runs can also exercise the real planner.
objective: Daily net revenue and 90-day retention reporting in Snowflake (dbt, dimensional) from shop and crm.
steps:
  - id: s2
    assignedAgent: dataModelerAgent
    phase: model
    taskDescription: Design the dimensional model — fct_order_lines (one row per order line), fct_daily_revenue, dim_customer (SCD2 on segment_code and lifecycle_stage), dim_product, dim_date.
  - id: s4
    assignedAgent: ingestionAgent
    phase: build
    dependsOn: [s2]
    taskDescription: Ingest shop.orders, shop.order_items, shop.refunds, shop.customers and crm.customers into the RAW layer; load orders incrementally on updated_at.
  - id: s5
    assignedAgent: transformScaffoldAgent
    phase: build
    dependsOn: [s4]
    taskDescription: Scaffold the dbt project — stg_orders (dedup on order_id, incremental on updated_at), dim_customer (SCD2), fct_daily_revenue (net revenue excluding cancelled orders, net of refunds).
