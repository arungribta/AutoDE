    licence: databricks-license
    availability: installable
    installer: databricks-agent-skills
    summary: Streaming patterns with Spark Structured Streaming.
    usedFor: { stageKinds: [build], platforms: [databricks] }
  - id: databricks-lakeflow-connect
    vendor: Databricks
    source: https://github.com/databricks/databricks-agent-skills/tree/main/skills/databricks-lakeflow-connect
    licence: databricks-license
    availability: installable
