# External skills AutoDE works with (v0.45.5). REFERENCES ONLY: no vendor skill text is copied
# here or anywhere in AutoDE, because their licences don't allow redistribution. The summaries
# are AutoDE's own words. A team corrects or adds entries in .autode/config/external-skills.yaml
# (same shape, merged by id) without waiting for an AutoDE release.
#
# availability:
#   installable   the user installs it with the vendor's own command (AutoDE offers it, runs it only on a click)
#   host-only     it exists only inside the vendor's host (nothing to install into another host)
#   importable    openly licensed: may be imported through PA4 with its attribution, after its licence is checked

installers:
  databricks-agent-skills:
    title: Databricks agent skills
    # Probed before it is offered: if the subcommand is gone, AutoDE shows the docs link instead of a stale command.
    command: [databricks, aitools, install]
    probe: [databricks, aitools, --help]
    minCliVersion: 1.0.0
    versionCommand: [databricks, --version]
    hostAlternatives:
      claude: "In Claude Code: /plugin marketplace add databricks/databricks-agent-skills, then /plugin install databricks@databricks-agent-skills"
      copilot: "copilot plugin marketplace add databricks/databricks-agent-skills, then copilot plugin install databricks@databricks-agent-skills"
    docs: https://github.com/databricks/databricks-agent-skills
    verifiedAt: 2026-10-22
    verifiedHow: against the vendor's README (the command was not run by AutoDE's CI yet)

licences:
  databricks-license:
    name: Databricks License
    url: https://raw.githubusercontent.com/databricks/databricks-agent-skills/main/LICENSE
    redistribution: false
    summary: Use only in connection with Databricks Services; modified files must say so; Databricks may end the licence on notice, after which copies must be deleted. AutoDE references these skills and never ships them.
  snowflake-cortex-code:
    name: Part of Snowflake Cortex Code
    url: https://www.snowflake.com/en/product/snowflake-coco/
    redistribution: false
    summary: Built into Cortex Code and available only inside it.
  coco-skills-per-skill:
    name: Per skill (Apache-2.0 for community contributions, a Snowflake licence for Snowflake employees' contributions)
    url: https://github.com/Snowflake-Labs/coco-skills
    redistribution: check
    summary: Each skill carries its own LICENSE file; check it before importing. Snowflake does not guarantee these skills' correctness.

entries:
  - id: databricks-core
    vendor: Databricks
    source: https://github.com/databricks/databricks-agent-skills/tree/main/skills/databricks-core
    licence: databricks-license
    availability: installable
    installer: databricks-agent-skills
    summary: Databricks CLI basics - authentication, profiles, exploring data; the base the other Databricks skills build on.
    usedFor: { stageKinds: [source-assessment, platform-setup, deploy], platforms: [databricks] }
  - id: databricks-dabs
    vendor: Databricks
    source: https://github.com/databricks/databricks-agent-skills/tree/main/skills/databricks-dabs
    licence: databricks-license
    availability: installable
    installer: databricks-agent-skills
    summary: Deploying jobs, pipelines and other resources as bundles.
    usedFor: { stageKinds: [deploy], platforms: [databricks] }
  - id: databricks-jobs
    vendor: Databricks
    source: https://github.com/databricks/databricks-agent-skills/tree/main/skills/databricks-jobs
    licence: databricks-license
    availability: installable
    installer: databricks-agent-skills
    summary: Orchestrating work as Lakeflow Jobs - task types, triggers, schedules, notifications.
    usedFor: { stageKinds: [build, deploy], platforms: [databricks] }
  - id: databricks-pipelines
    vendor: Databricks
    source: https://github.com/databricks/databricks-agent-skills/tree/main/skills/databricks-pipelines
    licence: databricks-license
    availability: installable
    installer: databricks-agent-skills
    summary: Batch and streaming pipelines with Lakeflow Declarative Pipelines (formerly Delta Live Tables).
    usedFor: { stageKinds: [build], platforms: [databricks] }
  - id: databricks-dbsql
    vendor: Databricks
    source: https://github.com/databricks/databricks-agent-skills/tree/main/skills/databricks-dbsql
    licence: databricks-license
    availability: installable
