<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src {{cspSource}} data:; style-src {{cspSource}} 'unsafe-inline'; script-src 'nonce-{{nonce}}';">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Platform catalog</title>
<style>
  :root {
    --border: var(--vscode-editorWidget-border, var(--vscode-panel-border, #4446));
    --muted: var(--vscode-descriptionForeground);
    --surface: var(--vscode-editorWidget-background, var(--vscode-sideBar-background));
    --link: var(--vscode-textLink-foreground);
    --ok: var(--vscode-testing-iconPassed, #2ea043);
    --warn: var(--vscode-editorWarning-foreground, #cca700);
    --bad: var(--vscode-editorError-foreground, #f14c4c);
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 0 16px 24px; font-family: var(--vscode-font-family); font-size: var(--vscode-font-size); color: var(--vscode-foreground); background: var(--vscode-editor-background); }
  .window-tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin: 0 -16px 8px; padding: 0 16px; }
  .window-tabs button { margin: 0; border: none; border-bottom: 2px solid transparent; background: transparent; color: var(--vscode-foreground); padding: 8px 12px; opacity: 0.75; cursor: pointer; font: inherit; }
  .window-tabs button[aria-selected="true"] { border-bottom-color: var(--vscode-focusBorder); opacity: 1; font-weight: 600; }
  h1 { font-size: 1.3em; margin: 12px 0 4px; } h2 { font-size: 1.05em; margin: 16px 0 6px; } h3 { font-size: 1em; margin: 12px 0 4px; }
  .muted { color: var(--muted); } .mono, code, pre { font-family: var(--vscode-editor-font-family); font-size: 0.95em; }
  pre { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 8px; overflow-x: auto; white-space: pre-wrap; }
  .crumbs { margin: 8px 0; } .crumbs button { margin-right: 4px; }
  .link { background: none; border: none; padding: 0; color: var(--link); cursor: pointer; font: inherit; text-align: left; }
  .link:hover { text-decoration: underline; }
  .btn { background: var(--vscode-button-secondaryBackground); color: var(--vscode-button-secondaryForeground); border: 1px solid transparent; border-radius: 4px; padding: 3px 10px; cursor: pointer; font: inherit; margin: 2px 4px 2px 0; }
  .btn.primary { background: var(--vscode-button-background); color: var(--vscode-button-foreground); }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 1px solid var(--vscode-focusBorder); outline-offset: 1px; }
  table { border-collapse: collapse; margin: 6px 0; } th, td { border-bottom: 1px solid var(--border); padding: 4px 10px 4px 0; text-align: left; vertical-align: top; }
  th { font-weight: 600; } td.cell { white-space: nowrap; }
  .s-supported, .s-ok { color: var(--ok); } .s-partly, .s-not-checked { color: var(--warn); } .s-failing { color: var(--bad); } .s-not_applicable, .s-not_declared { color: var(--muted); }
  [role=tablist].tabs { display: flex; flex-wrap: wrap; gap: 2px; border-bottom: 1px solid var(--border); margin: 10px 0; }
  [role=tablist].tabs button { border: none; border-bottom: 2px solid transparent; background: none; padding: 6px 10px; cursor: pointer; color: inherit; font: inherit; }
  [role=tablist].tabs button[aria-selected="true"] { border-bottom-color: var(--vscode-focusBorder); font-weight: 600; }
  .notice { margin: 8px 0; padding: 6px 8px; border-left: 3px solid var(--link); background: var(--surface); }
  .notice.error { border-left-color: var(--bad); }
  .empty { color: var(--muted); padding: 12px 0; }
  label { display: block; margin: 4px 0; } input[type=text], select { background: var(--vscode-input-background); color: var(--vscode-input-foreground); border: 1px solid var(--vscode-input-border, var(--border)); border-radius: 4px; padding: 3px 6px; font: inherit; min-width: 220px; }
  ul { margin: 4px 0; padding-left: 20px; }
  textarea { width: 100%; min-height: 4em; background: var(--vscode-input-background); color: var(--vscode-input-foreground); border: 1px solid var(--vscode-input-border, var(--border)); border-radius: 4px; padding: 4px 6px; font-family: var(--vscode-editor-font-family); font-size: 0.95em; }
  fieldset { border: 1px solid var(--border); border-radius: 4px; margin: 8px 0; padding: 6px 10px; } legend { padding: 0 4px; }
  .field-help { display: block; color: var(--muted); font-size: 0.9em; }
  .check-inline { display: inline-flex; align-items: center; gap: 4px; margin: 2px 12px 2px 0; }
  .badge { display: inline-block; margin-left: 6px; padding: 0 6px; border: 1px solid var(--warn); border-radius: 8px; color: var(--warn); font-size: 0.85em; font-weight: normal; }
  .badge.counted { border-color: var(--ok); color: var(--ok); }
  .steps li.done { color: var(--ok); } .steps li.missing { color: var(--warn); } .steps li.needs-code { color: var(--bad); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .block { display: block; }
  .findings li.error { color: var(--bad); } .findings li.warning { color: var(--warn); }
</style>
</head>
<body>
<nav class="window-tabs" role="tablist" aria-label="AutoDE window">
  <button role="tab" aria-selected="false" data-window-tab="workflow">Workflow</button>
  <button role="tab" aria-selected="false" data-window-tab="knowledge">Knowledge Explorer</button>
  <button role="tab" aria-selected="true">Platform catalog</button>
</nav>
<div id="notice" aria-live="polite"></div>
<main id="root"><p class="muted">Loading the catalog…</p></main>
<script nonce="{{nonce}}">
(function () {
  const vscode = acquireVsCodeApi();
  const root = document.getElementById('root');
  const notice = document.getElementById('notice');
  const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const send = (m) => vscode.postMessage(m);
  const SUPPORT = { supported: '✓ supported', partly: '◐ partly', not_applicable: '– not applicable', not_declared: '·' };
  const STATUS = { ok: '✓ works', partly: '◐ partly works', failing: '✗ fails', 'not-checked': '· not checked' };
  const state = { view: 'matrix', tab: 'overview', page: null, matrix: null, live: [], add: null, addCat: '', addId: '' };
  const BADGE = { draft: ['Draft', 'Not approved yet. It never runs until a person approves it.'], trial: ['On trial', 'Approved, but not yet proven on a real connection. Only conformance checks and Try it read from it.'], counted: ['Onboarded', 'Proven on a real connection and reviewed by a person.'] };
  const badge = (s) => s && BADGE[s] ? '<span class="badge ' + esc(s) + '" title="' + esc(BADGE[s][1]) + '">' + esc(BADGE[s][0]) + '</span>' : '';

  function crumbs(extra) { return '<div class="crumbs"><button class="link" data-go="matrix">Capability matrix</button>' + (extra ? ' › ' + extra : '') + '</div>'; }

  function matrixHtml(m) {
    if (!m.platforms.length) return '<h1>Platform catalog</h1><p class="empty">No platform definitions are loaded. AutoDE ships Snowflake, Databricks, Redshift and Oracle; a team adds its own in .autode/config/platforms/.</p>';
    let h = '<h1>Platform catalog</h1><p class="muted">What AutoDE can do on each platform, and what it needs. A cell shows the platform definition\'s answer, and the last conformance run on each of this workspace\'s connections. Choose a platform for its page.</p><p><button class="btn primary" data-add-system>Add a system…</button></p>';
    h += '<table role="grid" aria-label="Capability matrix"><thead><tr><th scope="col">Capability</th>' + m.platforms.map((p) => '<th scope="col"><button class="link" data-platform="' + esc(p.id) + '">' + esc(p.title) + '</button>' + badge(p.onboarding) + '<div class="muted">' + esc(p.category) + (p.connected ? ' · ' + p.connections.length + ' connection(s)' : ' · not connected') + '</div></th>').join('') + '</tr></thead><tbody>';
    for (const c of m.capabilities) {
      h += '<tr><th scope="row">' + esc(c) + '</th>' + m.platforms.map((p) => {
        const cell = m.cells[c][p.id];
        const conn = cell.connections.filter((x) => x.status !== 'not-checked').map((x) => '<div class="s-' + esc(x.status) + '">' + esc(x.connection) + ': ' + esc(STATUS[x.status]) + '</div>').join('');
        const why = [cell.note, cell.support === 'partly' && cell.privileges ? 'needs: ' + cell.privileges : ''].filter(Boolean).join(' ');
        return '<td class="cell"><span class="s-' + esc(cell.support) + '" title="' + esc(why) + '">' + esc(SUPPORT[cell.support]) + '</span>' + conn + '</td>';
      }).join('') + '</tr>';
    }
    h += '</tbody></table>';
    if (m.errors && m.errors.length) h += '<div class="notice error">Refused files: ' + m.errors.map(esc).join(' · ') + '</div>';
    return h;
  }

  function onboardingHtml(o) {
    if (!o) return '';
    const why = BADGE[o.state] ? '<p class="muted">' + esc(BADGE[o.state][1]) + '</p>' : '';
    return why + '<div class="notice"><strong>Next:</strong> ' + esc(o.next) + (o.review ? ' <button class="btn primary" data-file-review="1">File the review</button>' : '') + '</div>';
  }

  function addHtml(a) {
    if (!a) return crumbs('Add a system') + '<p class="muted">Loading…</p>';
    let h = crumbs('Add a system') + '<h1>Add a system</h1><p class="muted">Add a system AutoDE does not ship, such as one your team runs. You fill in a short file of answers; AutoDE checks it and proposes it. A person approves it before anything runs.</p>';
    if (!a.hasWorkspace) return h + '<p class="empty">Open a workspace folder first: the answers are kept in it.</p>';
    if (!a.categories.length) return h + '<p class="empty">No system categories are available. Reinstall AutoDE, or check that its platform-templates folder is present.</p>';
    h += '<div id="addsys"><fieldset><legend>1. What kind of system is it?</legend>' + a.categories.map((c) => '<label class="check-inline block"><input type="radio" name="category" value="' + esc(c.id) + '"' + (state.addCat === c.id ? ' checked' : '') + '> ' + esc(c.label) + '<span class="field-help">' + esc(c.description) + '</span></label>').join('') + '</fieldset>' +
      '<label for="sysid">2. Its id <input type="text" id="sysid" name="id" aria-describedby="sysid-h" value="' + esc(state.addId || '') + '"><span class="field-help" id="sysid-h">Lower case letters, digits, _ or -, starting with a letter. For example: sales_crm.</span></label>' +
      '<p><button class="btn primary" type="button" data-onb="start">Start</button><button class="btn" type="button" data-onb="check">Check</button><button class="btn" type="button" id="onb-propose" data-onb="propose" disabled>Propose</button></p>' +
      '<p class="muted">Start makes the answers file and opens it. Fill it in and save it. Check shows what is still missing. Propose is available once the check passes.</p></div><div id="onboardOut" aria-live="polite"></div>';
    return h;
  }

  function planHtml(pl) {
    let h = '';
    if (pl.status === 'needs-code') h += '<div class="notice error"><strong>This cannot be added from answers alone.</strong> It needs something that only AutoDE\'s own code can do, so nothing can be proposed:<ul>' + pl.neededCode.map((x) => '<li>' + esc(x) + '</li>').join('') + '</ul></div>';
    const LABEL = { done: '✓ done', missing: '◐ missing', 'needs-code': '✗ needs code' };
    h += '<h3>Steps</h3><ul class="steps">' + pl.steps.map((st) => '<li class="' + esc(st.state) + '">' + esc(st.title) + ': ' + esc(LABEL[st.state] || st.state) + (st.missing.length ? '<ul>' + st.missing.map((x) => '<li>' + esc(x) + '</li>').join('') + '</ul>' : '') + '</li>').join('') + '</ul>';
    h += pl.status === 'ready' ? '<p class="s-ok">Ready. Choose Propose to ask a person to approve it.</p>' : pl.status === 'incomplete' ? '<p class="s-partly">Not ready. Fill in what is missing in the answers file, save, and choose Check again.</p>' : '';
    return h;
  }

  function platformHtml(p) {
    if (!p) return crumbs() + '<p class="empty">No such platform.</p>';
    let h = crumbs(esc(p.title)) + '<h1>' + esc(p.title) + badge(p.onboarding && p.onboarding.state) + '</h1>' + onboardingHtml(p.onboarding) + '<div class="muted">' + esc(p.category) + ' · ' + esc(p.overview.origin) + ' definition, ' + esc(p.overview.status) + '</div>';
    if (!p.tabs.some((t) => t.id === state.tab)) state.tab = 'overview';
    h += '<div role="tablist" class="tabs" aria-label="Platform sections">' + p.tabs.map((t) => '<button role="tab" id="tab-' + t.id + '" aria-selected="' + (state.tab === t.id) + '" data-tab="' + t.id + '">' + esc(t.title) + '</button>').join('') + '</div><section role="tabpanel" aria-labelledby="tab-' + state.tab + '">';
    const t = state.tab;
    if (t === 'overview') {
      h += '<table><tr><th>Transports</th><td>' + esc(p.overview.transports.join(', ')) + '</td></tr><tr><th>Roles</th><td>' + esc(p.overview.roles.join(', ') || '—') + '</td></tr><tr><th>Version read by</th><td>' + (p.overview.versionOperation ? '<button class="link" data-op="' + esc(p.overview.versionOperation) + '">' + esc(p.overview.versionOperation) + '</button>' : '—') + '</td></tr><tr><th>Definition</th><td><button class="link" data-file="' + esc(p.overview.file) + '">' + esc(p.overview.file) + '</button>' + (p.overview.approvedBy ? ' (approved by ' + esc(p.overview.approvedBy) + ')' : '') + ' <button class="btn" data-customise="' + esc(p.id) + '">Customise…</button></td></tr></table>';
      h += '<h2>Connections</h2>' + (p.overview.connections.length ? '<ul>' + p.overview.connections.map((c) => '<li>' + esc(c.id) + ' (' + esc(c.role) + ') — ' + esc(c.readiness) + (c.detail ? ': ' + esc(c.detail) : '') + (state.live.includes(c.id) ? ' <button class="btn" data-conformance="' + esc(c.id) + '">Conformance run</button>' : ' <span class="muted">(connect it to run a conformance check)</span>') + '</li>').join('') + '</ul>' : '<p class="empty">No connection to ' + esc(p.title) + ' in this workspace: add one in Settings → Connections, then run a conformance check here.</p>');
    } else if (t === 'capabilities') {
      h += '<table><thead><tr><th>Capability</th><th>Support</th><th>Operations</th><th>On your connections</th></tr></thead><tbody>' + p.capabilities.map((c) => '<tr><td>' + esc(c.capability) + '</td><td class="s-' + esc(c.support) + '">' + esc(SUPPORT[c.support]) + (c.note ? '<div class="muted">' + esc(c.note) + '</div>' : '') + '</td><td>' + (c.operations.map((o) => '<button class="link" data-op="' + esc(o) + '">' + esc(o) + '</button>').join('<br>') || '<span class="muted">AutoDE\'s own code</span>') + '</td><td>' + (c.connections.map((x) => '<div class="s-' + esc(x.status) + '">' + esc(x.connection) + ': ' + esc(STATUS[x.status]) + (x.detail && x.status !== 'not-checked' ? '<div class="muted">' + esc(x.detail) + '</div>' : '') + '</div>').join('') || '<span class="muted">no connection</span>') + '</td></tr>').join('') + '</tbody></table>';
    } else if (t === 'operations') {
      h += p.operations.length ? p.operations.map((a) => '<h3>' + esc(a.area) + '</h3><ul>' + a.operations.map((o) => '<li><button class="link" data-op="' + esc(o.id) + '">' + esc(o.id) + '</button> — ' + esc(o.title) + ' <span class="muted">(' + esc(o.kind) + ', ' + esc(o.transport) + ', ' + esc(o.origin) + (o.status === 'draft' ? ', draft' : '') + (o.since ? ', since ' + esc(o.since) : '') + ')</span>' + (o.lastRun ? ' <span class="' + (o.lastRun.ok ? 's-ok' : 's-failing') + '">last run ' + (o.lastRun.ok ? 'ok' : 'failed') + '</span>' : '') + '</li>').join('') + '</ul>').join('') : '<p class="empty">No operations for this platform yet.</p>';
    } else if (t === 'skills') {
      h += p.skills.length ? '<ul>' + p.skills.map((k) => '<li><button class="link" data-skill="' + esc(k.id) + '">' + esc(k.id) + '</button> <span class="muted">(' + esc(k.group) + (k.availability ? ', ' + esc(k.availability) : '') + ')</span> — ' + esc(k.summary) + (k.operations && k.operations.length ? '<div class="muted">operations: ' + k.operations.map(esc).join(', ') + '</div>' : '') + '</li>').join('') + '</ul>' : '<p class="empty">No skill names this platform. A team imports one through Port a Skill.</p>';
    } else if (t === 'tools') {
      const cli = p.tools && p.tools.cli;
      h += cli ? '<table><tr><th>CLI</th><td class="mono">' + esc(cli.command) + '</td></tr><tr><th>Minimum version</th><td>' + esc(cli.minVersion || '—') + '</td></tr><tr><th>Install</th><td>' + esc(cli.install || '—') + '</td></tr><tr><th>Profiles</th><td>' + (cli.profiles ? 'listed from the CLI' : '—') + '</td></tr></table>' : '<p class="empty">No CLI declared.</p>';
      if (p.tools && p.tools.api) h += '<p>API: ' + esc(p.tools.api) + '</p>';
      h += '<p class="muted">Installed? <code>autode doctor</code> and Settings → Connections check the CLI on this machine; AutoDE never installs it for you.</p>';
    } else if (t === 'primitives') {
      h += '<p>Deliverables compile to the <code>' + esc(p.primitives.dialect) + '</code> dialect.</p><ul>' + p.primitives.primitives.map((x) => '<li class="' + (x.compiles ? 's-ok' : 's-failing') + '">' + (x.compiles ? '✓ ' : '✗ ') + esc(x.kind) + ' <span class="muted">— ' + esc(x.description) + (x.reason ? ' (' + esc(x.reason) + ')' : '') + '</span></li>').join('') + '</ul>';
    } else if (t === 'privileges') {
      h += p.privileges.length ? '<table><thead><tr><th>Capability</th><th>What AutoDE\'s role needs</th><th>Granted by</th></tr></thead><tbody>' + p.privileges.map((x) => '<tr><td>' + esc(x.capability) + '</td><td>' + esc(x.privileges) + '</td><td>' + ((x.grants || []).map((g) => '<button class="link" data-op="' + esc(g) + '">' + esc(g) + '</button>').join('<br>') || '<span class="muted">no grant operation: ask in words</span>') + '</td></tr>').join('') + '</tbody></table>' : '<p class="empty">The definition names no privileges.</p>';
      const conns = p.overview.connections;
      h += '<h2>Request access</h2>';
      if (!conns.length) h += '<p class="empty">Add a connection to ' + esc(p.title) + ' (Settings → Connections) to request access for it.</p>';
      else if (!p.privileges.some((x) => x.grants && x.grants.length)) h += '<p class="empty">No capability here names grant operations, so there is no runbook to draft: send the privileges above to whoever administers the platform.</p>';
      else h += '<p class="muted">Drafts a runbook that grants AutoDE\'s role these privileges, from the grant operations above. With an active problem it is proposed for a person who administers the platform to approve and run; nothing is granted from here.</p><form id="access">' +
        '<label>Connection <select name="connection">' + conns.map((c) => '<option>' + esc(c.id) + '</option>').join('') + '</select><span class="field-help">The connection whose role needs the access.</span></label>' +
        '<label>Role <input type="text" name="role" placeholder="the connection\'s role"><span class="field-help">The role AutoDE connects as (on Databricks the user, group or service principal). Empty: the connection\'s role field.</span></label>' +
        '<label>Schemas <input type="text" name="schemas" placeholder="comma-separated"><span class="field-help">The schemas in scope. Empty: the connection\'s schema.</span></label>' +
        '<fieldset><legend>Capabilities</legend>' + p.privileges.filter((x) => x.grants && x.grants.length).map((x) => '<label class="check-inline"><input type="checkbox" name="cap" value="' + esc(x.capability) + '"> ' + esc(x.capability) + '</label>').join('') + '<span class="field-help">None ticked: those the last conformance run found short, else all of them.</span></fieldset>' +
        '<button class="btn primary" type="button" data-request-access>Draft the runbook</button></form><div id="accessOut" aria-live="polite"></div>';
    } else if (t === 'health') {
      h += '<h3>Conformance</h3>' + (p.health.conformance.length ? '<ul>' + p.health.conformance.map((c) => '<li>' + esc(c.connection) + ' (' + esc(c.at.slice(0, 16).replace('T', ' ')) + '): ' + esc(c.summary) + '</li>').join('') + '</ul>' : '<p class="empty">No conformance run yet: run one from Overview on a connected connection.</p>');
      h += '<h3>Drift</h3>' + ((p.health.drift && p.health.drift.length) || (p.health.unreadKinds && p.health.unreadKinds.length) ? '<ul class="findings">' + p.health.drift.map((d) => '<li class="error"><button class="link" data-op="' + esc(d.operation) + '">' + esc(d.operation) + '</button> on ' + esc(d.connection) + (d.version ? ' (' + esc(d.version) + ')' : '') + ': ' + esc(d.error) + '</li>').join('') + p.health.unreadKinds.map((k) => '<li class="warning">' + esc(k.count) + ' object(s) of kind <code>' + esc(k.kind) + '</code> that the definition doesn\'t name (' + esc(k.connections.join(', ')) + ')</li>').join('') + '</ul><p class="muted">Maintenance items for the platform maintainer.</p>' : '<p class="empty">No drift.</p>');
      h += '<h3>Proposals</h3>' + (p.health.proposals && p.health.proposals.length ? '<ul>' + p.health.proposals.map((x) => '<li>' + esc(x.decision) + ' ' + esc(x.file) + (x.reason ? ' — ' + esc(x.reason) : '') + '</li>').join('') + '</ul>' : '<p class="empty">None waiting.</p>');
      h += '<h3>Failing now</h3>' + (p.health.failing.length ? '<ul>' + p.health.failing.map((r) => '<li class="s-failing"><button class="link" data-op="' + esc(r.operation) + '">' + esc(r.operation) + '</button> on ' + esc(r.connection) + ': ' + esc(r.error || '') + '</li>').join('') + '</ul>' : '<p class="empty">Nothing failing.</p>');
      h += '<h3>Drafts waiting for approval</h3>' + (p.health.drafts.length ? '<ul>' + p.health.drafts.map((d) => '<li>' + esc(d) + '</li>').join('') + '</ul>' : '<p class="empty">None.</p>');
      h += '<h3>Recent runs</h3>' + (p.health.recent.length ? '<ul>' + p.health.recent.map((r) => '<li>' + esc(r.at.slice(0, 16).replace('T', ' ')) + ' ' + esc(r.operation) + ' on ' + esc(r.connection) + ' — ' + (r.ok ? esc((r.rows || 0) + ' row(s)') : '<span class="s-failing">' + esc(r.error || 'failed') + '</span>') + (r.via ? ' <span class="muted">(' + esc(r.via) + ')</span>' : '') + '</li>').join('') + '</ul>' : '<p class="empty">No runs recorded yet.</p>');
    }
    return h + '</section>';
  }

  function operationHtml(o) {
    if (!o) return crumbs() + '<p class="empty">No such operation.</p>';
    let h = crumbs(esc(o.id)) + '<h1>' + esc(o.id) + '</h1><div>' + esc(o.title) + '</div><p class="muted">' + esc(o.description) + '</p>';
    h += '<p>' + esc(o.kind) + ' · ' + esc(o.area) + ' · ' + esc(o.origin) + (o.status === 'draft' ? ' · draft (never runs until approved)' : '') + (o.approvedBy ? ' · approved by ' + esc(o.approvedBy) : '') + ' · <button class="link" data-file="' + esc(o.file) + '">' + esc(o.file) + '</button> <button class="btn" data-customise="' + esc(o.id) + '">Customise…</button> <button class="btn" data-opform="' + esc(o.id) + '">Edit in a form…</button></p>';

        if (c.upstreamChanged) h += '<div class="notice error">AutoDE\'s version changed: v' + esc(c.baseVersion) + ' → ' + (c.autodeVersion !== undefined ? 'v' + esc(c.autodeVersion) : 'no longer shipped') + (c.autodeChanges.length ? ' (' + c.autodeChanges.map((x) => esc(x.path) + ' ' + esc(x.change)).join(', ') + ')' : '') + '. Merge what you want into the copy, then Keep; or Reset to take AutoDE\'s.</div>';
        h += '<p class="muted">' + (c.teamChanges.length ? 'The team changed: ' + c.teamChanges.map((x) => esc(x.path) + ' ' + esc(x.change)).join(', ') : 'The copy is still AutoDE\'s text.') + ' Next: ' + esc(c.next) + '.</p>';
        h += '<h3>Checks</h3>' + (c.findings.length ? '<ul class="findings">' + c.findings.map((f) => '<li class="' + esc(f.severity) + '">line ' + esc(f.line) + ': ' + esc(f.message) + '</li>').join('') + '</ul>' : '<p class="s-ok">Nothing flagged. The editor checks as you type.</p>');
        h += '<details><summary>History</summary><ul>' + c.history.map((x) => '<li>' + esc(x.at.slice(0, 16).replace('T', ' ')) + ' ' + esc(x.by) + ': ' + esc(x.action) + ' → ' + esc(x.to) + ' (v' + esc(x.version) + ')</li>').join('') + '</ul></details>';
      }

    if (k.actions && k.actions.length) h += '<p>' + k.actions.map((a) => '<button class="btn' + (a === 'customise' || a === 'publish' ? ' primary' : '') + '" data-skill-action="' + esc(a) + '">' + esc(ACT[a]) + '</button>').join('') + '</p>';

      h += '<h2>Metadata</h2><form id="meta"><label>Description <textarea name="description" aria-describedby="d-desc">' + esc(k.meta.description) + '</textarea><span class="field-help" id="d-desc">What the skill does and when to use it: hosts pick a skill by this text (at most 1024 characters).</span></label>' +
        '<fieldset><legend>Stage kinds</legend>' + k.meta.allStageKinds.map((s) => '<label class="check-inline"><input type="checkbox" name="stageKinds" value="' + esc(s) + '"' + (k.meta.stageKinds.includes(s) ? ' checked' : '') + '> ' + esc(s) + '</label>').join('') + '<span class="field-help">The workflow stages it serves: a stage of that kind gets it in its assignment.</span></fieldset>' +

        '<p class="muted">Operations it uses come from its text: ' + (k.operations.map((o) => esc(o.id)).join(', ') || 'none') + '.</p><div id="metaChecks" aria-live="polite"></div><button class="btn primary" type="button" data-save-meta>Save</button></form>';

  function opFormHtml(f) {
    if (!f) return crumbs() + '<p class="empty">No such operation.</p>';
    const ctl = (x, prefix) => {
      const id = prefix + x.key; const help = x.description ? '<span class="field-help" id="h-' + esc(id) + '">' + esc(x.description) + '</span>' : '';
      const attrs = ' name="' + esc(prefix + x.key) + '" id="' + esc(id) + '" aria-describedby="h-' + esc(id) + '"';
      const input = x.control === 'readonly' ? '<code>' + esc(x.value) + '</code>' : x.control === 'textarea' ? '<textarea' + attrs + '>' + esc(x.value) + '</textarea>' : x.control === 'select' ? '<select' + attrs + '>' + (x.required ? '' : '<option value=""></option>') + x.options.map((o) => '<option' + (o === x.value ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select>' : x.control === 'checkbox' ? '<input type="checkbox"' + attrs + (x.value === 'true' ? ' checked' : '') + '>' : '<input type="text"' + attrs + ' value="' + esc(x.value) + '">';
      return '<label for="' + esc(id) + '">' + esc(x.label) + (x.required ? ' *' : '') + ' ' + input + help + '</label>';
    };
    let h = crumbs('<button class="link" data-op="' + esc(f.id) + '">' + esc(f.id) + '</button> › form') + '<h1>Edit ' + esc(f.id) + '</h1><p class="muted">Saves to ' + esc(f.file) + '. ' + esc(f.next) + ' The form comes from the operation format\'s schema; fields marked * are required.</p><form id="opform">';
    h += f.fields.map((x) => ctl(x, 'f.')).join('');
    h += '<h2>Parameters</h2>' + (f.params.rows.length ? f.params.rows.map((row, i) => '<fieldset><legend>Parameter ' + (i + 1) + '</legend>' + f.params.columns.map((col) => ctl({ ...col, value: row[col.key] || '' }, 'p' + i + '.')).join('') + '</fieldset>').join('') : '<p class="muted">None.</p>');
    h += '<h2>Per platform</h2>' + f.platforms.map((p) => '<label for="s.' + esc(p.platform) + '">' + esc(p.label) + ' <span class="muted">(' + esc(p.transport) + ')</span>' + (p.transport === 'other' ? '<pre>' + esc(p.value) + '</pre>' : '<textarea id="s.' + esc(p.platform) + '" name="s.' + esc(p.platform) + '" rows="5">' + esc(p.value) + '</textarea>') + '<span class="field-help">' + esc(p.description) + '</span></label>').join('');
    h += '<div id="opChecks" aria-live="polite"></div><button class="btn primary" type="button" data-save-op>Save as a team draft</button><button class="btn" type="button" data-propose-op>Propose for approval</button></form>';
    return h;
  }

  function opEdit() {
    const f = document.getElementById('opform'); const edit = { fields: {}, params: [], platforms: {} };
    f.querySelectorAll('input, select, textarea').forEach((el) => {
      const v = el.type === 'checkbox' ? String(el.checked) : el.value;
      if (el.name.startsWith('f.')) edit.fields[el.name.slice(2)] = v;
      else if (el.name.startsWith('s.')) edit.platforms[el.name.slice(2)] = v;
      else { const m = /^p(\d+)\.(.+)$/.exec(el.name); if (m) { const i = Number(m[1]); edit.params[i] = edit.params[i] || {}; edit.params[i][m[2]] = v; } }
    });
    return edit;
  }

  function metaEdit() {
    const f = document.getElementById('meta');
    return { description: f.querySelector('[name=description]').value, stageKinds: [...f.querySelectorAll('[name=stageKinds]:checked')].map((x) => x.value), platforms: [...f.querySelectorAll('[name=platforms]:checked')].map((x) => x.value) };
  }

  function findingsHtml(list, ok) {
    return list.length ? '<ul class="findings">' + list.map((f) => '<li class="' + esc(f.severity || 'error') + '">' + (f.line ? 'line ' + esc(f.line) + ': ' : '') + esc(f.message || f) + '</li>').join('') + '</ul>' : '<p class="s-ok">' + esc(ok) + '</p>';
  }

  function render() {
    root.innerHTML = state.view === 'matrix' ? (state.matrix ? matrixHtml(state.matrix) : '<p class="muted">Loading…</p>') : state.view === 'platform' ? platformHtml(state.page) : state.view === 'operation' ? operationHtml(state.page) : state.view === 'opform' ? opFormHtml(state.page) : state.view === 'add' ? addHtml(state.add) : skillHtml(state.page);
    const h1 = root.querySelector('h1'); if (h1) h1.setAttribute('tabindex', '-1');
  }

  function formValues() {
    const f = document.getElementById('try'); const out = {}; let platform = '', connection = '';
    f.querySelectorAll('input, select').forEach((el) => { if (el.name === '__platform') platform = el.value; else if (el.name === '__connection') connection = el.value; else if (el.value.trim()) out[el.name] = el.value.trim(); });
    return { params: out, platform, connection };
  }

  root.addEventListener('click', (e) => {
    const t = e.target.closest('button'); if (!t) return;
    const d = t.dataset;
    if (t.hasAttribute('data-add-system')) { state.view = 'add'; state.add = null; send({ type: 'addSystem' }); render(); }
    else if (d.onb) {
      const f = document.getElementById('addsys'); const cat = f.querySelector('[name=category]:checked'); const id = f.querySelector('[name=id]').value.trim();
      state.addCat = cat ? cat.value : ''; state.addId = id;
      document.getElementById('onboardOut').innerHTML = '<p class="muted">Working…</p>';
      send({ type: d.onb === 'start' ? 'onboardingStart' : d.onb === 'check' ? 'onboardingCheck' : 'onboardingPropose', category: state.addCat, id });
    }
    else if (t.hasAttribute('data-file-review')) send({ type: 'fileReview', id: state.page.id });
    else if (d.go === 'matrix') { state.view = 'matrix'; send({ type: 'matrix' }); render(); }
    else if (d.platform) { state.tab = 'overview'; send({ type: 'platform', id: d.platform }); }
    else if (d.op) send({ type: 'operation', id: d.op });
    else if (d.skill) send({ type: 'skill', id: d.skill });
    else if (d.tab) { state.tab = d.tab; render(); const b = document.getElementById('tab-' + d.tab); if (b) b.focus(); }
    else if (d.file) send({ type: 'openFile', file: d.file });
    else if (d.customise) send({ type: 'customise', id: d.customise });
    else if (d.opform) send({ type: 'operationForm', id: d.opform });
    else if (d.resolve && d.decision) send({ type: 'resolveDecision', id: d.decision, decision: d.resolve, operation: state.page.id });
    else if (d.skillAction) send({ type: 'skillAction', id: state.page.id, action: d.skillAction });
    else if (t.hasAttribute('data-save-meta')) send({ type: 'saveMeta', id: state.page.id, edit: metaEdit() });
    else if (t.hasAttribute('data-save-op')) send({ type: 'saveOperation', id: state.page.id, edit: opEdit() });
    else if (t.hasAttribute('data-propose-op')) send({ type: 'proposeOperation', id: state.page.id });
    else if (t.hasAttribute('data-request-access')) {
      const f = document.getElementById('access');
      document.getElementById('accessOut').innerHTML = '<p class="muted">Drafting…</p>';
      send({ type: 'requestAccess', connection: f.querySelector('[name=connection]').value, role: f.querySelector('[name=role]').value.trim(), schemas: f.querySelector('[name=schemas]').value.split(',').map((x) => x.trim()).filter(Boolean), capabilities: [...f.querySelectorAll('[name=cap]:checked')].map((x) => x.value) });
    }
    else if (d.conformance) send({ type: 'conformance', connection: d.conformance });
    else if (t.hasAttribute('data-preview')) { const v = formValues(); send({ type: 'preview', operation: state.page.id, platform: v.platform, params: v.params }); }
    else if (t.hasAttribute('data-try')) { const v = formValues(); document.getElementById('tryOut').innerHTML = '<p class="muted">Running…</p>'; send({ type: 'try', operation: state.page.id, connection: v.connection, params: v.params }); }
  });
  root.addEventListener('keydown', (e) => {
    const tab = e.target.closest && e.target.closest('[role=tablist].tabs [role=tab]');
    if (!tab || (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft')) return;
    const tabs = [...root.querySelectorAll('[role=tablist].tabs [role=tab]')]; const i = tabs.indexOf(tab);
    const next = tabs[(i + (e.key === 'ArrowRight' ? 1 : tabs.length - 1)) % tabs.length]; next.click(); e.preventDefault();
  });
  // Checks as you type: the metadata and operation forms are checked by the engine after a short pause.
  let checkTimer;
  root.addEventListener('input', (e) => {
    const form = e.target.closest && e.target.closest('form'); if (!form || (form.id !== 'meta' && form.id !== 'opform')) return;
    clearTimeout(checkTimer);
    checkTimer = setTimeout(() => send(form.id === 'meta' ? { type: 'checkMeta', id: state.page.id, edit: metaEdit() } : { type: 'checkOperation', id: state.page.id, edit: opEdit() }), 300);
  });
  document.querySelectorAll('[data-window-tab]').forEach((b) => { b.onclick = () => send({ type: 'openTab', tab: b.getAttribute('data-window-tab') }); });

  window.addEventListener('message', (ev) => {
    const m = ev.data;
    if (m.type === 'matrix') { state.matrix = m.matrix; state.live = m.live || []; if (state.view === 'matrix') render(); }
    else if (m.type === 'platform') { state.view = 'platform'; state.page = m.page; state.live = m.live || []; render(); }
    else if (m.type === 'operation') { state.view = 'operation'; state.page = m.page; state.live = m.live || []; const out = document.getElementById('tryOut'); const keep = out ? out.innerHTML : ''; render(); if (keep) document.getElementById('tryOut').innerHTML = keep; }
    else if (m.type === 'addSystem') { state.view = 'add'; state.add = m; render(); const h = root.querySelector('h1'); if (h) h.focus(); }
    else if (m.type === 'onboardingOut') {
      const out = document.getElementById('onboardOut'); if (!out) return;
      out.innerHTML = (m.error ? '<div class="notice error">' + esc(m.error) + '</div>' : '') + (m.text ? '<div class="notice">' + esc(m.text) + '</div>' : '') + (m.plan ? planHtml(m.plan) : '') + (m.proposed ? '<p>Decision <strong>' + esc(m.proposed) + '</strong>. A person approves it in Decisions.</p>' : '');

    }
    else if (m.type === 'skill') { state.view = 'skill'; state.page = m.page; render(); }
    else if (m.type === 'operationForm') { state.view = 'opform'; state.page = m.form; render(); }
    else if (m.type === 'metaChecks') { const out = document.getElementById('metaChecks'); if (out) out.innerHTML = findingsHtml(m.findings, 'Nothing flagged.'); }
    else if (m.type === 'opChecks') { const out = document.getElementById('opChecks'); if (out) out.innerHTML = findingsHtml(m.problems, m.saved ? 'Saved as a draft: ' + m.file + '. Propose it for approval when it is ready.' : 'The operation would load.'); }

      const out = document.getElementById('accessOut'); if (!out) return;
      out.innerHTML = m.error ? '<div class="notice error">' + esc(m.error) + '</div>' : '<h3>' + esc(m.runbook.title) + '</h3><ol>' + m.runbook.steps.map((s) => '<li>' + esc(s.title) + '<pre>' + esc(s.sql) + '</pre></li>').join('') + '</ol>' + (m.warnings.length ? '<ul class="findings">' + m.warnings.map((w) => '<li class="warning">' + esc(w) + '</li>').join('') + '</ul>' : '') + '<div class="notice">' + esc(m.next) + '</div>';
    }
    else if (m.type === 'preview') { const out = document.getElementById('tryOut'); if (out) out.innerHTML = m.error ? '<div class="notice error">' + esc(m.error) + '</div>' : '<h3>' + (m.kind === 'change' ? 'The runbook step it would be' : 'The statement that would run') + '</h3><pre>' + esc(m.statement) + '</pre>'; }
    else if (m.type === 'tried') {
      const out = document.getElementById('tryOut'); if (!out) return;
      out.innerHTML = m.error ? '<div class="notice error">' + esc(m.error) + '</div>' : m.change ? '<div class="notice">' + esc(m.message) + '</div><pre>' + esc(JSON.stringify(m.step, null, 2)) + '</pre>' :
        '<h3>' + (m.ok ? '✓ Ran' : '✗ ' + esc(m.gap || 'failed')) + '</h3>' + (m.statement ? '<pre>' + esc(m.statement) + '</pre>' : '') + '<p>' + esc(m.count) + ' row(s).' + (m.withheld ? ' Row values aren\'t shown here: run it with <code>autode platform run</code>, which applies the connection\'s sample-data consent and masking.' : '') + '</p>' +
        (m.rows && m.rows.length ? '<table><thead><tr>' + Object.keys(m.rows[0]).map((k) => '<th>' + esc(k) + '</th>').join('') + '</tr></thead><tbody>' + m.rows.map((r) => '<tr>' + Object.keys(m.rows[0]).map((k) => '<td>' + esc(r[k]) + '</td>').join('') + '</tr>').join('') + '</tbody></table>' : '');
    }
    else if (m.type === 'notice') { notice.innerHTML = '<div class="notice' + (m.error ? ' error' : '') + '">' + esc(m.text) + '</div>'; }
  });
  send({ type: 'ready' });
})();
</script>
</body>
</html>
