      quality:
        - check: not_null
          attribute: loan identifier
        - check: range
          attribute: principal amount
          note: greater than zero
        - check: unique
          attribute: loan identifier
    module: LOAN/LoansGeneral/Loans
  - id: fibo:LoanApplication
    label: Loan Application
    definition: request by a potential borrower to a potential lender to borrow
