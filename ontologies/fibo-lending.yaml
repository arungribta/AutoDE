    iri: https://spec.edmcouncil.org/fibo/ontology/FND/ProductsAndServices/ProductsAndServices/Customer
    parent: upper:Party
    synonyms:
      - client
    relations:
      - verb: holds
        target: fibo:Account
        cardinality: 0..*
    attributes:
      identifying:
        - customer identifier
    hints:
      classifications:
        - pii
      quality:
        - check: unique
          attribute: customer identifier
    module: FND/ProductsAndServices/ProductsAndServices
  - id: fibo:FinancialProduct
    label: Financial Product
    definition: product provided to consumers and businesses by financial
      institutions such as banks, insurance companies, brokerage firms, consumer
      finance companies, and investment companies
    iri: https://spec.edmcouncil.org/fibo/ontology/FBC/ProductsAndServices/FinancialProductsAndServices/FinancialProduct
    parent: upper:Product
    attributes:
      identifying:
        - product code
      notable:
        - product name
        - product type
    module: FBC/ProductsAndServices/FinancialProductsAndServices
  - id: fibo:Guarantor
    label: Guarantor
    definition: party that guarantees, endorses, or provides indemnity for some
      obligation on behalf of some other party
    iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Guaranty/Guarantor
    parent: upper:Party
    synonyms:
      - surety
    module: FBC/DebtAndEquities/Guaranty
  - id: fibo:Guaranty
    label: Guaranty
    definition: commitment whereby something is formally assured if a party with
      primary liability fails to perform
    iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Guaranty/Guaranty
    parent: fibo:Contract
    synonyms:
      - guarantee
    relations:
      - verb: guarantees
        target: fibo:Loan
        cardinality: 1..*
      - verb: hasGuarantor
        target: fibo:Guarantor
        cardinality: 1..*
    module: FBC/DebtAndEquities/Guaranty
  - id: fibo:Lender
    label: Lender
    definition: a party that extends credit or money to a borrower with the
      expectation of being repaid, usually with interest
    iri: https://spec.edmcouncil.org/fibo/ontology/FBC/DebtAndEquities/Debt/Lender
    parent: upper:Party
    synonyms:
      - creditor
    module: FBC/DebtAndEquities/Debt
  - id: fibo:Loan
    label: Loan
    definition: debt instrument whereby one party extends money or credit to another
      party (or parties) with the understanding that the borrowed money will be
      repaid according to the terms of the contract
    iri: https://spec.edmcouncil.org/fibo/ontology/LOAN/LoansGeneral/Loans/Loan
    parent: fibo:CreditAgreement
    synonyms:
